# Dependency updates come from the platform (a11ign/a11ign ADR 0041, decision 4; row a11ign/a11ign#3968): a new release of an action this
# repository's workflows call opens a pull request here, so nobody polls for one. Dependabot, because it is a file and not an app install.
# Row #3968's Acceptance reads this file on `main` AFTER the merge: it is a 404 there before it, by design, and a reading at this file's PR head is the pre-merge check.
version: 2
updates:
  - package-ecosystem: github-actions
    # `directory: /` is the one Dependabot documents for this ecosystem: it reads every `uses:` under `.github/workflows/` from there. That covers
    # the `actions/*` pins today and a reusable-workflow call pinned at a full commit sha (a11ign/a11ign#3965), which nothing else would move.
    directory: /
    schedule:
      # Weekly, as the row asks. a11ign/a11ign and a11ign/toolchain run `daily`; this repository has few action pins, and a pull request the
      # caller reviews each week is enough for them.
      interval: weekly
    # No `groups:` on purpose: each action is its own pull request, which keeps a bump small and mergeable alone.
    commit-message:
      # The handle the org's gate recognises a dependency pull request by: every title starts `deps:`.
      prefix: deps
  # The npm packages the lint job runs (ticket A11-95): ESLint, its TypeScript parser and the Clean Code plugin, pinned EXACT in `package.json`. Each upgrade is a
  # pull request that a person reviews. Only these three are covered, because the rest of the npm tree is a separate decision.
  - package-ecosystem: npm
    directory: /
    schedule:
      # Weekly, as the github-actions entry above: a new release of one of these is reviewed when it is opened, not on arrival.
      interval: weekly
    allow:
      - dependency-name: eslint
      - dependency-name: typescript-eslint
      # The plugin is one maintainer's and days old when it was pinned, so its upgrades are the ones most worth a read of the bundle before merge.
      - dependency-name: "@george2f/eslint-plugin-clean-code"
    cooldown:
      # A release is seven days old before Dependabot opens its pull request, so a bump a day after it ships has had time for someone to notice a problem.
      default-days: 7
    commit-message:
      # The same handle as the github-actions entry: every title starts `deps:`.
      prefix: deps
