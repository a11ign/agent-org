name: auto-arm

# ENABLE AUTO-MERGE ON EVERY NON-DRAFT PULL REQUEST AGAINST main, so nobody arms by hand (pared from a11ign/a11ign's auto-arm.yml,
# a11ign/a11ign#2792). Arming only ARMS the merge: GitHub still withholds it until the required check `gate` is green and the ruleset's
# approving review is present for the current head.
#
# WHICH TOKEN ARMS MATTERS, AND THE LOG SAYS WHICH RAN. GitHub does not trigger workflows from events created with GITHUB_TOKEN, so a merge
# completed with it fires no `pull_request: closed` and no `push` (measured on a11ign/a11ign: 19 of 19 bot merges never ran close-rows). A
# merge armed with A11IGN_BOT_TOKEN is attributed to that identity and fires them. When the secret is absent this arms with GITHUB_TOKEN and
# prints a warning; the first `AUTO-ARM:` line of a run is the reading of which path ran (a11ign/a11ign#2623 Done-when 1).
#
# NOT COPIED, AND WHY: the sweep, the stalled report and update-branch jobs of the original call a11ign's own scripts and need its board; this
# repository holds only the tool. They are added when something here needs them, not before.

on:
  pull_request:
    branches: [main]
    types: [opened, ready_for_review, reopened, synchronize]
  # `token-reach` only: `arm` is kept off both of these by its `if`.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

jobs:
  arm:
    # `github.event.pull_request` is null on a push or a dispatch, and `null == false` is TRUE in an Actions expression, so the event name is checked first.
    # A fork's pull request gets no secrets and a read-only token, so arming it would only fail; a fork's change is armed by a maintainer.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (merge commit)
        env:
          A11IGN_BOT_TOKEN: ${{ secrets.A11IGN_BOT_TOKEN }}
          FALLBACK_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          # THE LABELS COME THROUGH `env:`, NEVER INTERPOLATED INTO THE SCRIPT: a label name is typed by whoever can label, and `${{ }}` inside `run:` is
          # pasted into the shell as text.
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          # MIRRORS `HOLD_PREFIX` in src/pr-hold-state.mjs, which `armabilityOf` reads for `arm-pr.mjs` and `auto-arm-sweep.mjs`. This job runs on
          # `actions/checkout` alone and must stay that way, so it cannot import the predicate; `auto-arm-workflow-honours-hold.test.ts` fails if the two drift.
          HOLD_PREFIX: "hold:"
        run: |
          # A HOLD IS A PREFIX, NOT A SUBSTRING (`on-hold` and `holdout` do not hold). A refusal is a DONE and exits 0, as in `arm-pr.mjs`: red here would
          # read as a failed arm when the PR is exactly as it was asked to be (a11ign/a11ign#3867).
          holders=$(printf '%s' "$PR_LABELS" | jq -r --arg prefix "$HOLD_PREFIX" '[.[] | select(startswith($prefix))] | join(", ")')
          if [ -n "$holders" ]; then
            echo "AUTO-ARM: not arming #${PULL_REQUEST} in ${REPOSITORY}: held by ${holders} (armabilityOf, src/pr-hold-state.mjs: a ${HOLD_PREFIX} label IS the hold)"
            exit 0
          fi
          if [ -n "$A11IGN_BOT_TOKEN" ]; then
            export GH_TOKEN="$A11IGN_BOT_TOKEN"
            token_name=A11IGN_BOT_TOKEN
          else
            echo "::warning::A11IGN_BOT_TOKEN is not set -- arming with GITHUB_TOKEN instead. A merge completed with it fires no workflow events."
            export GH_TOKEN="$FALLBACK_TOKEN"
            token_name=GITHUB_TOKEN
          fi
          echo "AUTO-ARM: arming #${PULL_REQUEST} in ${REPOSITORY} with ${token_name}"
          gh pr merge "$PULL_REQUEST" --repo "$REPOSITORY" --auto --merge

  token-reach:
    # DOES `A11IGN_BOT_TOKEN` REACH THIS REPOSITORY ON THE WRITE SIDE? (a11ign/a11ign#3710, #3751). The job's NAME is a contract: a11ign's
    # `layer-repository-protection.test.ts` reads the latest run of a job named `token-reach` in the workflow its code-repository table names as this
    # repository's `tokenProbe` (this file), and its `token` cell for this repository reads CANNOT_TELL until one has run on `main`.
    #
    # The `if`, `permissions` and `steps` below are a11ign/a11ign's `token-reach` (release.yml at e701fbdfd) copied byte for byte, so the two can be
    # diffed; its `run:` block is the instrument, measured there against four credentials on all eight repositories (read that job's comment for the
    # measurements: a ref read is NOT the probe, because every code repository is public).
    #
    # RUNS ON a push to `main` (every merge) or a `workflow_dispatch` (`gh workflow run auto-arm.yml --ref main`), never on a pull request, whose
    # fork runs hold no secret and would fail the probe for the wrong reason.
    #
    # IT GATES NOTHING: no job `needs` it, and `arm` keeps its documented GITHUB_TOKEN fallback, because stopping every arm for a token problem is
    # worse than the degradation this reports. A reading at a moment, per run, never a standing certificate.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Probe the token's reach on the write side, failing with a TOKEN-REACH line that names the cause
        env:
          A11IGN_BOT_TOKEN: ${{ secrets.A11IGN_BOT_TOKEN }}
        run: |
          repo="$GITHUB_REPOSITORY"
          say() { echo "::error::TOKEN-REACH $repo: $1"; exit 1; }
          [ -n "$A11IGN_BOT_TOKEN" ] || say "A11IGN_BOT_TOKEN is not set, so nothing here can push, open or arm a pull request with it"
          status() { curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "$@" || true; }
          basic=$(printf 'x-access-token:%s' "$A11IGN_BOT_TOKEN" | base64 -w0)
          push=$(status -H "Authorization: Basic $basic" "https://github.com/$repo.git/info/refs?service=git-receive-pack")
          pulls=$(status -X POST -H "Authorization: Bearer $A11IGN_BOT_TOKEN" -d '{}' "https://api.github.com/repos/$repo/pulls")
          if [ "$push/$pulls" = "200/422" ]; then
            echo "TOKEN-REACH $repo: ok (push service 200; POST /pulls 422, authorised, nothing created)"
            exit 0
          fi
          for s in "$push" "$pulls"; do
            case "$s" in 000|5??) say "CANNOT_TELL the probe could not ask (push $push, pulls $pulls); this is not a reading of the token" ;; esac
          done
          [ "$push" = 200 ] || say "the token cannot push here: the push service answered HTTP $push (401: rejected, expired or revoked; 403 or 404: it does not reach this repository, or only reads it)"
          say "the token pushes but cannot open or arm pull requests here: POST /pulls answered HTTP $pulls where 422 was wanted (403: it lacks pull-requests: write)"
