name: auto-arm

# ENABLE AUTO-MERGE ON EVERY NON-DRAFT PULL REQUEST AGAINST main, so nobody arms by hand (pared from a11ign/a11ign's auto-arm.yml,
# a11ign/a11ign#2792). Arming only ARMS the merge: GitHub still withholds it until the required check `gate` is green and the ruleset's
# approving review is present for the current head.
#
# WHICH TOKEN ARMS MATTERS. GitHub does not trigger workflows from events created with GITHUB_TOKEN, so a merge completed with it fires no
# `pull_request: closed` and no `push` (measured on a11ign/a11ign: 19 of 19 bot merges never ran close-rows). A merge armed with an app
# installation token is attributed to that identity and fires them. That token is an OCTO STS one (a11ign/a11ign#4199, as #4198 did for
# a11ign/a11ign): `octo-sts/action` mints it per run against `.github/chainguard/auto-arm.sts.yaml` and revokes it in its post step, so nothing
# is stored. There is NO fallback to GITHUB_TOKEN: a fallback arms with the token that fires nothing, which is the defect restored quietly,
# and a failed mint is a red `arm` step that names itself. A policy is read from the DEFAULT branch (octo-sts/app v0.11.2), so a pull request
# that adds or changes it takes effect when it merges. The first `AUTO-ARM:` line of a run still says which repository and pull request.
#
# THIS JOB RUNS `main`'s COPY OF THIS FILE, NEVER A BRANCH'S, so it rides `pull_request_target` and not `pull_request`: a `pull_request` run
# presents `job_workflow_ref` = `...@refs/pull/N/merge` (the branch's copy, measured on a11ign/a11ign#4191), which no policy can bind to `main`,
# and a branch editing this job could mint a write token. The job has no checkout and runs nothing the pull request wrote: it reads the event's
# number, draft flag, head repository and labels. The policy pins `job_workflow_ref` to `@refs/heads/main`.
#
# NOT COPIED, AND WHY: the update-branch job of the original calls a11ign's own scripts and needs its board; this repository holds only the tool. It is added when something here needs it,
# not before. The sweep and the stalled report are here for ANOTHER reason, below.

# THE OUTSIDE HOME OF a11ign's ARMING (agent-org#1573, the epic "agent-org stands alone", a11ign/a11ign#928), SHIPPED OFF. a11ign's own `auto-arm.yml` runs the tool's `arm-pr`, `auto-arm-sweep`
# and `queue-stalled` ON a11ign, which is the org's process acting on a project and so must run from outside it before it can leave. `outside-sweep` and `outside-stalled` are those two commands,
# on a schedule, run from THIS repository's tool against a11ign's checkout; the pull-request event and the approval are the host gate's (`settleOutsideArm`, src/work-gate/pr-orders.ts).
# THE FLAG IS a11ign's, NOT THIS REPOSITORY'S: `outside.arm` in a11ign's `.agent-org/decisions.json`, read through the same reader as every other key (absent = off). OFF, each job checks out,
# reads that one file (before any token is minted) and ends green having read and written nothing else. ON, it acts beside a11ign's own jobs and finds their work done (the sweep lists only the unarmed). The revert is the key
# `false`; a11ign's jobs are still running, so nothing stops arming.
# WHICH TOKEN: the sweep ARMS, so it mints (Octo STS, `scope: a11ign/a11ign`, identity `outside-arm`) for the reason `arm` above does, and there is NO fallback to `github.token`. The policy is
# a11ign's (its `outside-arm` Octo STS policy, read from a11ign's default branch; a11ign/a11ign#5619) and is filed as its own row, so until it lands a mint is a red `outside-sweep` step that says so. The
# stalled report only READS, and holds the same minted token (the test of a11ign/a11ign#4199 allows `github.token` in no job but `relay`). A schedule runs `main`'s copy of this file, which is what the policy pins (`job_workflow_ref` at `@refs/heads/main`).

# AN APPROVING REVIEW MARKS A DRAFT READY AND ARMS IT, WITH NO WORKER TURN (a11ign/a11ign#4969, chairman 2026-10-11). `arm` ignores drafts and no
# event of its own fires on a review, so a draft approved while still a draft waited for a worker to flip it (agent-org#782: 117 minutes).
# `pull_request_review` runs THE BRANCH'S copy of the file, exactly the shape the paragraph above forbids a minting job, so it carries ONE job,
# `relay`, which mints nothing and dispatches `main`'s copy with the PR number. `arm-approved` is the `workflow_dispatch` half: it runs as
# `main`'s copy (the policy admits that event on `refs/heads/main`), re-reads the PR as the minted token and acts only on
# `reviewDecision == APPROVED` for an open, same-repository PR against `main` that carries no `hold:` label. Nothing the dispatch says is trusted.

# A STACKED PULL REQUEST IS MERGED WITH GITHUB'S STACK MERGE, NOT AUTO-MERGE (A11-238). GitHub refuses `gh pr merge --auto` and a plain merge for any pull request in a stack ("Auto-merge is not
# supported for stacked pull requests"); it accepts only `PUT /pulls/{n}/merge-async` (what `gh stack merge` calls), which merges or queues that pull request AND every open member below it,
# atomically. `arm-approved` makes that call, with the same minted token, for a stacked pull request whose base is `main` (so every member below has merged and the call names this one pull
# request only; one higher up is skipped by the base check) and whose required checks are green (the API does not wait for checks as auto-merge does). A refusal is one keyed comment on the pull
# request, carrying the head it was given at, which the board reads onto the run's card and which goes stale when the head moves. `arm` only says so and writes nothing. Unstacking is not an
# option: it removes every unmerged member, so the members above lose their link.

on:
  pull_request_target:
    branches: [main]
    types: [opened, ready_for_review, reopened, synchronize]
  pull_request_review:
    types: [submitted]
  # agent-org#1573: the outside home's two scheduled jobs. A cron is not a promise (GitHub disables scheduled workflows after 60 days without repository activity, and this repository is never idle that
  # long), and the pull-request event is not what this runs on: that is the gate's, every two minutes.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to mark ready (if still a draft) and arm, when it is approved (a11ign/a11ign#4969)"
        required: true
        type: string

jobs:
  arm:
    # The event name is checked first, as `github.event.pull_request` is null on any other event and `null == false` is TRUE in an Actions expression.
    # A fork's pull request gets no secrets and a read-only token, so arming it would only fail; a fork's change is armed by a maintainer.
    if: github.event_name == 'pull_request_target' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    # The job's own `GITHUB_TOKEN` holds only the OIDC request Octo STS needs; the writes come from the minted token, whose grant is `auto-arm.sts.yaml`'s.
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Mint the arming token (Octo STS, `auto-arm.sts.yaml`) -- no fallback to `GITHUB_TOKEN`, see the header (a11ign/a11ign#4199)
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: auto-arm
      - name: Is the pull request in a stack? GitHub refuses auto-merge to one (A11-238)
        id: stack
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          # The `stack` field of a pull request is sent under this API version (GitHub's stacked-pull-request docs).
          API_VERSION: "2026-03-10"
        run: |
          # A READ THAT FAILS IS NOT AN ANSWER: it is asked three times, and then the step goes red with nothing written. "Not stacked" is never assumed.
          read_stack=no
          for attempt in 1 2 3; do
            if number=$(gh api -H "X-GitHub-Api-Version: $API_VERSION" "repos/$REPOSITORY/pulls/$PULL_REQUEST" --jq '.stack.number // empty'); then read_stack=yes; break; fi
            sleep 5
          done
          if [ "$read_stack" != yes ]; then
            echo "::error::AUTO-ARM: could not read whether #${PULL_REQUEST} is in a stack: not arming it"
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: A stacked pull request is left to `arm-approved`, which stack-merges it once it is approved and green (A11-238)
        if: steps.stack.outputs.number != ''
        env:
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          echo "AUTO-ARM: #${PULL_REQUEST} is in a stack: GitHub refuses auto-merge for stacks, so arm-approved merges it with the stack merge once it is approved and green"
      - name: Enable auto-merge (merge commit)
        if: steps.stack.outputs.number == ''
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          # THE LABELS COME THROUGH `env:`, NEVER INTERPOLATED INTO THE SCRIPT: a label name is typed by whoever can label, and `${{ }}` inside `run:` is
          # pasted into the shell as text.
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          # MIRRORS `HOLD_PREFIX` in src/pr-hold-state.ts, which `armabilityOf` reads for `arm-pr.mjs` and `auto-arm-sweep.mjs`. This job runs on
          # `actions/checkout` alone and must stay that way, so it cannot import the predicate; `auto-arm-workflow-honours-hold.test.ts` fails if the two drift.
          HOLD_PREFIX: "hold:"
        run: |
          # A HOLD IS A PREFIX, NOT A SUBSTRING (`on-hold` and `holdout` do not hold). A refusal is a DONE and exits 0, as in `arm-pr.mjs`: red here would
          # read as a failed arm when the PR is exactly as it was asked to be (a11ign/a11ign#3867).
          holders=$(printf '%s' "$PR_LABELS" | jq -r --arg prefix "$HOLD_PREFIX" '[.[] | select(startswith($prefix))] | join(", ")')
          if [ -n "$holders" ]; then
            echo "AUTO-ARM: not arming #${PULL_REQUEST} in ${REPOSITORY}: held by ${holders} (armabilityOf, src/pr-hold-state.ts: a ${HOLD_PREFIX} label IS the hold)"
            exit 0
          fi
          echo "AUTO-ARM: arming #${PULL_REQUEST} in ${REPOSITORY} with the Octo STS token"
          gh pr merge "$PULL_REQUEST" --repo "$REPOSITORY" --auto --merge

  relay:
    # A CHANGES_REQUESTED or COMMENTED review, a fork's head and a base other than `main` (`pull_request_review` has no `branches:` filter) do nothing. This job runs the BRANCH's copy of the file and so holds no
    # `id-token` and mints nothing; `actions: write` is what dispatching `main`'s copy takes (a dispatch made with `GITHUB_TOKEN` starts a run).
    if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Hand the approved pull request to `main`'s copy of this workflow (a11ign/a11ign#4969)
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: gh workflow run auto-arm.yml --repo "$REPOSITORY" --ref main -f pr="$PULL_REQUEST"

  arm-approved:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Mint the arming token (Octo STS, `auto-arm.sts.yaml`) -- no fallback to `GITHUB_TOKEN`, see the header (a11ign/a11ign#4199)
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: auto-arm
      - name: Mark an approved draft ready and arm it, or stack-merge a stacked one -- unless held, forked, closed or not against main (a11ign/a11ign#4969, A11-238)
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          PULL_REQUEST: ${{ github.event.inputs.pr }}
          REPOSITORY: ${{ github.repository }}
          API_VERSION: "2026-03-10"
          # How long the stack merge is followed before the job stops watching: the board sees the queue seat or the merge on its next read.
          POLL_SECONDS: "5"
          POLL_ATTEMPTS: "12"
          # MIRRORS `HOLD_PREFIX` in src/pr-hold-state.ts, as `arm` does above; `auto-arm-workflow-honours-hold.test.ts` fails if the two drift.
          HOLD_PREFIX: "hold:"
        run: |
          case "$PULL_REQUEST" in ''|*[!0-9]*) echo "::error::AUTO-ARM: pr input '$PULL_REQUEST' is not a pull request number"; exit 1;; esac
          # An approval is readable a moment after the review event, so a dispatch that outruns it asks again before it refuses.
          for attempt in 1 2 3; do
            pr=$(gh pr view "$PULL_REQUEST" --repo "$REPOSITORY" --json state,baseRefName,isCrossRepository,reviewDecision,isDraft,labels,headRefOid)
            [ "$(jq -r .reviewDecision <<<"$pr")" = APPROVED ] && break
            sleep 5
          done
          verdict=$(jq -r --arg prefix "$HOLD_PREFIX" '
            [.labels[].name | select(startswith($prefix))] as $holds
            | if .state != "OPEN" then "skip: the pull request is " + .state
              elif .baseRefName != "main" then "skip: its base is " + .baseRefName + ", not main"
              elif .isCrossRepository then "skip: its head is in a fork"
              elif .reviewDecision != "APPROVED" then "skip: reviewDecision is \(.reviewDecision | if . == "" then "empty" else . end), not APPROVED"
              elif ($holds | length) > 0 then "skip: held by " + ($holds | join(", "))
              elif .isDraft then "ready"
              else "arm" end' <<<"$pr")
          case "$verdict" in
            skip:*) echo "AUTO-ARM: leaving #${PULL_REQUEST} in ${REPOSITORY} untouched -- ${verdict#skip: }"; exit 0;;
          esac
          # A READ THAT FAILS IS NOT AN ANSWER (A11-238): it is asked three times, and then the job goes red with nothing written, not even the draft marked ready. "Not stacked" is never assumed,
          # so a pull request in a stack is never given to auto-merge on a guess, nor a plain one left unarmed without a red job saying so.
          read_stack=no
          for attempt in 1 2 3; do
            if stack=$(gh api -H "X-GitHub-Api-Version: $API_VERSION" "repos/$REPOSITORY/pulls/$PULL_REQUEST" --jq '.stack.number // empty'); then read_stack=yes; break; fi
            sleep 5
          done
          if [ "$read_stack" != yes ]; then
            echo "::error::AUTO-ARM: could not read whether #${PULL_REQUEST} in ${REPOSITORY} is in a stack: not arming it"
            exit 1
          fi
          if [ "$verdict" = ready ]; then
            echo "AUTO-ARM: #${PULL_REQUEST} is an approved draft: marking it ready"
            gh pr ready "$PULL_REQUEST" --repo "$REPOSITORY"
          fi
          if [ -z "$stack" ]; then
            echo "AUTO-ARM: arming #${PULL_REQUEST} in ${REPOSITORY} with the Octo STS token"
            gh pr merge "$PULL_REQUEST" --repo "$REPOSITORY" --auto --merge
            exit 0
          fi

          # A STACKED PULL REQUEST (A11-238). Its base is `main` (checked above), so it is the bottom open member and the atomic merge takes this one only. The API does not wait
          # for checks, so they are read first: exit 8 is pending, anything else is red. Neither fails this job; the board dispatches again when the pull request is ready.
          head=$(jq -r .headRefOid <<<"$pr")
          checks=0
          report=$(gh pr checks "$PULL_REQUEST" --repo "$REPOSITORY" --required 2>&1) || checks=$?
          if [ "$checks" -ne 0 ]; then
            state=red; [ "$checks" -eq 8 ] && state=pending
            echo "AUTO-ARM: #${PULL_REQUEST} is stacked and its required checks are not green (${state}): not merging yet"
            printf '%s\n' "$report"
            exit 0
          fi

          # A refusal is ONE comment, keyed by the marker and carrying the head it was given at; it is edited in place, and the board reads it (it is stale once the head moves).
          refuse() {
            body=$(printf '<!-- agent-org:stack-merge head=%s -->\nGitHub refused the stack merge of #%s: %s' "$head" "$PULL_REQUEST" "$1")
            echo "AUTO-ARM: GitHub refused the stack merge of #${PULL_REQUEST} in ${REPOSITORY}: $1"
            existing=$(gh api --paginate "repos/$REPOSITORY/issues/$PULL_REQUEST/comments" --jq '.[] | select(.body | startswith("<!-- agent-org:stack-merge ")) | .id' | tail -n 1)
            if [ -n "$existing" ]; then
              gh api -X PATCH "repos/$REPOSITORY/issues/comments/$existing" -f body="$body" >/dev/null
            else
              gh api -X POST "repos/$REPOSITORY/issues/$PULL_REQUEST/comments" -f body="$body" >/dev/null
            fi
            exit 0
          }

          echo "AUTO-ARM: #${PULL_REQUEST} is stacked: requesting the stack merge of ${REPOSITORY}#${PULL_REQUEST}, up to this pull request, with the Octo STS token"
          err=$(mktemp)
          trap 'rm -f "${err:?}"' EXIT
          put=0
          answer=$(gh api -X PUT -H "X-GitHub-Api-Version: $API_VERSION" "repos/$REPOSITORY/pulls/$PULL_REQUEST/merge-async" -f sha="$head" -f merge_method=merge -f merge_action=default 2>"$err") || put=$?
          if [ "$put" -ne 0 ]; then
            # 409: another request for this pull request is already running, which is the state asked for. Any other refusal is shown.
            if grep -q 'HTTP 409' "$err"; then echo "AUTO-ARM: a stack merge of #${PULL_REQUEST} is already pending"; exit 0; fi
            reason=$(jq -r '.message // empty' <<<"$answer" 2>/dev/null || true)
            refuse "${reason:-$(cat "$err")}"
          fi
          uuid=$(jq -r '.details.uuid // empty' <<<"$answer")
          # The answer to the PUT is read first, then each poll's: POLL_ATTEMPTS polls, every one read.
          for poll in $(seq 0 "$POLL_ATTEMPTS"); do
            status=$(jq -r .status <<<"$answer")
            case "$status" in
              merged|enqueued) echo "AUTO-ARM: the stack merge of #${PULL_REQUEST} is ${status}"; exit 0;;
              failed) refuse "$(jq -r '.details.message // "no reason given"' <<<"$answer")";;
            esac
            if [ -z "$uuid" ] || [ "$poll" -eq "$POLL_ATTEMPTS" ]; then break; fi
            sleep "$POLL_SECONDS"
            answer=$(gh api -H "X-GitHub-Api-Version: $API_VERSION" "repos/$REPOSITORY/pulls/$PULL_REQUEST/merge-async/$uuid")
          done
          echo "AUTO-ARM: the stack merge of #${PULL_REQUEST} is still pending: the board reads the queue seat or the merge on its next read"

  # agent-org#1573. THE TOOL IS THIS CHECKOUT AND THE PROJECT IS a11ign's, side by side, because the tool serves the repository it is run in (`resolveHomeCheckout`, the standalone layout): `cd project`
  # makes a11ign the home checkout, and the flag is its `.agent-org/decisions.json`. `--ignore-scripts`: nothing the install runs is wanted here.
  outside-sweep:
    if: github.event_name == 'schedule' && github.repository == 'a11ign/agent-org'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    concurrency:
      group: outside-arm-sweep
    steps:
      - uses: actions/checkout@v7
        with:
          path: tool
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: a11ign/a11ign
          path: project
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Install the tool's dependencies (no scripts)
        working-directory: tool
        run: npx --yes pnpm@10.34.5 install --frozen-lockfile --ignore-scripts
      # THE FLAG IS READ BEFORE ANYTHING IS MINTED: off, there is no token, no policy needed and nothing written.
      - name: Is `outside.arm` on in a11ign's decisions.json? (the tool's own reader; absent is off)
        id: flag
        working-directory: project
        run: echo "on=$(node ../tool/src/arm-pr.ts --outside-arm-state=.agent-org/decisions.json)" >> "$GITHUB_OUTPUT"
      - name: Mint the arming token for a11ign (Octo STS, a11ign's `outside-arm.sts.yaml`) -- the token is minted, never borrowed (agent-org#1573)
        if: steps.flag.outputs.on == 'true'
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: a11ign/a11ign
          identity: outside-arm
      - name: Arm every open, non-draft, unheld, tested, same-repository pull request against main that nothing has armed -- only when a11ign's `outside.arm` is on
        if: steps.flag.outputs.on == 'true'
        working-directory: project
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          GITHUB_REPOSITORY: a11ign/a11ign
        run: |
          status=0
          node ../tool/src/auto-arm-sweep.ts --outside-switches=.agent-org/decisions.json || status=$?
          if [ "$status" -eq 2 ]; then
            echo "::error::CANNOT_ASK (exit 2): the outside sweep could not LIST a11ign's open pull requests, so it examined none. The standing queue is UNKNOWN, not drained."
          fi
          exit "$status"

  outside-stalled:
    if: github.event_name == 'schedule' && github.repository == 'a11ign/agent-org'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: tool
          persist-credentials: false
      # `queue-stalled` runs `git merge-tree` of every open head against `origin/main`, so it needs the history; it is the project's, whole.
      - uses: actions/checkout@v7
        with:
          repository: a11ign/a11ign
          path: project
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Install the tool's dependencies (no scripts)
        working-directory: tool
        run: npx --yes pnpm@10.34.5 install --frozen-lockfile --ignore-scripts
      - name: Is `outside.arm` on in a11ign's decisions.json? (the tool's own reader; absent is off)
        id: flag
        working-directory: project
        run: echo "on=$(node ../tool/src/arm-pr.ts --outside-arm-state=.agent-org/decisions.json)" >> "$GITHUB_OUTPUT"
      # The report only READS, but `auto-arm-octo-sts.test.ts` (a11ign/a11ign#4199) allows `github.token` in no job here but `relay`, so it holds the same minted token as the sweep, after the same flag.
      - name: Mint the token for a11ign (Octo STS, a11ign's `outside-arm` policy) -- the token is minted, never borrowed (agent-org#1573)
        if: steps.flag.outputs.on == 'true'
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: a11ign/a11ign
          identity: outside-arm
      - name: Report every armed, green pull request of a11ign that cannot merge as-is against main -- only when a11ign's `outside.arm` is on
        if: steps.flag.outputs.on == 'true'
        working-directory: project
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          GITHUB_REPOSITORY: a11ign/a11ign
        run: node ../tool/src/queue-stalled.ts --outside-switches=.agent-org/decisions.json
