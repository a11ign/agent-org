name: auto-arm

# ENABLE AUTO-MERGE ON EVERY NON-DRAFT PULL REQUEST AGAINST main, so nobody arms by hand (pared from a11ign/a11ign's auto-arm.yml,
# a11ign/a11ign#2792). Arming only ARMS the merge: GitHub still withholds it until the required check `gate` is green and the ruleset's
# approving review is present for the current head.
#
# WHICH TOKEN ARMS MATTERS. GitHub does not trigger workflows from events created with GITHUB_TOKEN, so a merge completed with it fires no
# `pull_request: closed` and no `push` (measured on a11ign/a11ign: 19 of 19 bot merges never ran close-rows). A merge armed with an app
# installation token is attributed to that identity and fires them. That token is an OCTO STS one (a11ign/a11ign#4199, as #4198 did for
# a11ign/a11ign): `octo-sts/action` mints it per run against `.github/chainguard/auto-arm.sts.yaml` and revokes it in its post step, so nothing
# is stored. There is NO fallback to GITHUB_TOKEN: a fallback arms with the token that fires nothing, which is the defect restored quietly,
# and a failed mint is a red `arm` step that names itself. A policy is read from the DEFAULT branch (octo-sts/app v0.11.2), so a pull request
# that adds or changes it takes effect when it merges. The first `AUTO-ARM:` line of a run still says which repository and pull request.
#
# THIS JOB RUNS `main`'s COPY OF THIS FILE, NEVER A BRANCH'S, so it rides `pull_request_target` and not `pull_request`: a `pull_request` run
# presents `job_workflow_ref` = `...@refs/pull/N/merge` (the branch's copy, measured on a11ign/a11ign#4191), which no policy can bind to `main`,
# and a branch editing this job could mint a write token. The job has no checkout and runs nothing the pull request wrote: it reads the event's
# number, draft flag, head repository and labels. The policy pins `job_workflow_ref` to `@refs/heads/main`.
#
# NOT COPIED, AND WHY: the sweep, the stalled report and update-branch jobs of the original call a11ign's own scripts and need its board; this
# repository holds only the tool. They are added when something here needs them, not before.

on:
  pull_request_target:
    branches: [main]
    types: [opened, ready_for_review, reopened, synchronize]

jobs:
  arm:
    # The event name is checked first, as `github.event.pull_request` is null on any other event and `null == false` is TRUE in an Actions expression.
    # A fork's pull request gets no secrets and a read-only token, so arming it would only fail; a fork's change is armed by a maintainer.
    if: github.event_name == 'pull_request_target' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    # The job's own `GITHUB_TOKEN` holds only the OIDC request Octo STS needs; the writes come from the minted token, whose grant is `auto-arm.sts.yaml`'s.
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Mint the arming token (Octo STS, `auto-arm.sts.yaml`) -- no fallback to `GITHUB_TOKEN`, see the header (a11ign/a11ign#4199)
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: auto-arm
      - name: Enable auto-merge (merge commit)
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          # THE LABELS COME THROUGH `env:`, NEVER INTERPOLATED INTO THE SCRIPT: a label name is typed by whoever can label, and `${{ }}` inside `run:` is
          # pasted into the shell as text.
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          # MIRRORS `HOLD_PREFIX` in src/pr-hold-state.ts, which `armabilityOf` reads for `arm-pr.mjs` and `auto-arm-sweep.mjs`. This job runs on
          # `actions/checkout` alone and must stay that way, so it cannot import the predicate; `auto-arm-workflow-honours-hold.test.ts` fails if the two drift.
          HOLD_PREFIX: "hold:"
        run: |
          # A HOLD IS A PREFIX, NOT A SUBSTRING (`on-hold` and `holdout` do not hold). A refusal is a DONE and exits 0, as in `arm-pr.mjs`: red here would
          # read as a failed arm when the PR is exactly as it was asked to be (a11ign/a11ign#3867).
          holders=$(printf '%s' "$PR_LABELS" | jq -r --arg prefix "$HOLD_PREFIX" '[.[] | select(startswith($prefix))] | join(", ")')
          if [ -n "$holders" ]; then
            echo "AUTO-ARM: not arming #${PULL_REQUEST} in ${REPOSITORY}: held by ${holders} (armabilityOf, src/pr-hold-state.ts: a ${HOLD_PREFIX} label IS the hold)"
            exit 0
          fi
          echo "AUTO-ARM: arming #${PULL_REQUEST} in ${REPOSITORY} with the Octo STS token"
          gh pr merge "$PULL_REQUEST" --repo "$REPOSITORY" --auto --merge
