name: outside-trunk

# THE OUTSIDE HOME OF A PROJECT'S TRUNK JOBS (agent-org#1576, epic "agent-org stands alone", a11ign/a11ign#928). `src/outside-trunk.ts` has the header: it runs the project's `closeRows`,
# revert guard and liveness checks from here, behind `outside.trunk` in the PROJECT's `.agent-org/decisions.json`, and does nothing while that key is absent. The scheduled
# half of the home; the host gate is the other (`recordRouteOutcomesOnHost` calls it paced).
#
# SHIPPED OFF TWICE. The job is skipped while the repository variable `OUTSIDE_TRUNK_PROJECT` (`owner/name` of the project) is unset, so no project is named in this file, and when it is set
# the command still reads the flag and does nothing until it is true. Both revert the same way: unset the variable, or set the flag to `false`.
#
# THE PROJECT IS CHECKED OUT BESIDE THE TOOL, in full history, because the revert guard reads its git and the board check reads its workflow files; the command finds it as the
# repository it is run in (`resolveHomeCheckout`, the standalone layout). `OUTSIDE_TRUNK_TOKEN` is a token for that repository: it closes rows and comments once on a stale report.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: outside-trunk
  cancel-in-progress: false

jobs:
  outside-trunk:
    if: ${{ vars.OUTSIDE_TRUNK_PROJECT != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { path: tool }
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.OUTSIDE_TRUNK_PROJECT }}
          token: ${{ secrets.OUTSIDE_TRUNK_TOKEN }}
          path: project
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with: { node-version: 24.21.0 }
      - name: The tool's dependencies
        working-directory: tool
        run: npm install --omit=dev --ignore-scripts --no-package-lock
      - name: Close the rows merged lately, check the new commits, and ask whether the board still arrives (does nothing while the flag is off)
        working-directory: project
        env:
          GH_TOKEN: ${{ secrets.OUTSIDE_TRUNK_TOKEN }}
        run: node ../tool/src/bin.ts outside-trunk --force
