name: ci

# THE REQUIRED CHECK IS `gate` (a11ign/a11ign#2792; ADR 0040 decision 6 step 6). A check name can be required only after it has run once,
# and this file's first pull request is that run. Since a11ign/a11ign#3986 `gate` is the LAST job: it waits for `suite` and `typecheck` and is green only if both
# are, so the one context a non-admin can read as required carries both (the last job of this file says why).
#
# `suite` (what `gate` was before #3986) RUNS THE TOOL'S WHOLE TEST SUITE (a11ign/a11ign#2973, cut-over 2 of 6), because after the cut this repository is the only place the tool's
# tests can run and "fix forward, no rollback copy" is safe only with a gate that can go red. The suite cannot run in this tree alone: the tool reads
# `.agent-org/project.json` and walks the project it is pointed at, and when that was tried here without one, 158 of 464 subtests failed and 60 of
# 125 modules did not import, all for that reason. So the job takes ROUTE (a) of the row: it checks out the project under test,
# a11ign/a11ign (public) at $PROJECT_REF, into `project/`, puts this checkout's tool where the tool lives in a project (`project/packages/agent-org`)
# and runs the suite from the project's root. Route (b), a fixture project inside this repository (ADR 0040 decision 8), does not exist yet, and the
# suite reads the project's real tree (its rules files, its `.agent-org/`, its git history) in ways a fixture would have to reproduce.
#
# WHAT `gate` CANNOT PROVE (decision 8's limit): it proves the tool against ONE project, a11ign, at the ref named below -- not against any other
# project's declaration -- and the project moves on its own, so a red `gate` would be the project's change and not the pull request's: #3097 turned every pull request
# here red for about 50 minutes that way (a11ign/a11ign#3886). PROJECT_REF is therefore a FULL COMMIT SHA, which separates the two.
#
# BUMPING `PROJECT_REF` IS A PULL REQUEST, and the only way the project's changes reach this repository's CI: Dependabot cannot read a commit pin, so
# `renovate.json` carries a regex rule for the `PROJECT_REF` line below (a11ign/a11ign#5153), and `src/ci-pins-the-project.test.ts` holds the value to a full commit sha and nothing else.
# The order is fixed: the project bumps nothing, this repository bumps the pin when it wants to read a newer project (Renovate opens the pull request,
# on `bot/project-ref-bump`, and this repository's own `gate` decides it), and a red `gate` is this repository's own. `control` and `lab` pin `CORE_REF` the same way.
#
# THE TESTS' SIBLINGS COME FROM THE LAB: the tool's tests were extracted from the lab package (`project/packages/lab/src/packaging/`), where they sat beside helper
# modules and fixtures that were not extracted. a11ign/a11ign deleted that package (#3505) and takes a11ign/lab as a pinned tag, so the job lays the lab at the tag the project's
# `layers.json` pins AT `PROJECT_REF` (the project's own `project/scripts/lay-layer.ts`) and copies those siblings (never a test) beside the tests, without overwriting anything this repository has.
#
# NODE IS PINNED TO 24.21.0, NOT `24`, and it must be 24: Node 24 strips types itself, and a `.ts` run by a plain `node` (every ExecStart, every package script, `leak-scan.ts`'s import) needs it
# (a11ign/a11ign#4389; the distro 22 cannot). The pin was 22.22.1 because on 22.23.3 the suite's tree-walking observer saw the old loader probe `<name>.mts` beside every import: the loader is gone, so that
# cause is too. Move the pin only by re-running the suite on the new version (24.21.0: 7583 tests, the 33 failures all fail on main too).
#
# NAMING A PATH THAT LIVES IN THE PROJECT: `workflow-paths.ts` refuses a workflow path (`packages/...`, `scripts/...`) that is not in THIS
# repository, so a path in the project is written with the `project/` prefix, or carries the marker `# in-project` at the end of its line.
#
# EVERY TEST THE SUITE HOLDS RUNS, UNDER ONE RUNNER, RSTEST (a11ign/a11ign#3738, #3958): a step compares the files rstest lists with the files on disk, so a test file its `include` does not reach fails the job.
# The run reports `skipped 1` (the test that needs the `codex` binary, which skips itself).
# Four tests whose premise was the monorepo's directory layout were once skipped by name (a11ign/a11ign#2973) and are now fixed in the tests (#3002):
# an exclusion is a test that does not run, so a defect in what it guards would have gone unseen.

env:
  # a11ign/a11ign at the commit the tool's suite was last run against (54947391e, 2026-10-11, the a11ign/a11ign#5144 merge, the originals of `src/lib/cli-flags.ts` and `src/lib/git-env.ts` that `copies-drifted` compares agent-org's copies against (agent-org#1055, agent-org#1049); before it eaebb69cd, 2026-10-11, the a11ign/a11ign#4960 merge, which carries the `ceo.md` bound for `idleClaimedHours` that `org-retro.test.ts` reads (agent-org#862, advanced by agent-org#884); before it 1d11a3726, 2026-10-09, which contains #4287's Octo STS `auto-arm.yml` that `auto-arm-token.test.ts` pins (a11ign/a11ign#4288); before it 4649f4d93, 2026-10-08, the #4177 merge, which carries the `ceo.md` bound for `unwaitedStockRows` that `org-retro.test.ts` requires (#4175); before it 4da77f552, after #4089 rewrote `examples/workflow.yml`; moved from 9915703d6 of 2026-10-06 because `public-claim.test.ts` reads that
  # file and no allow-list entry matches both versions). A sha and never a branch: a branch moves under a pull request that did not touch it.
  PROJECT_REF: a9ae7147dba6c891844ec6ea16e41e6594c4292d

on:
  pull_request:
    branches: [main]
    # `edited`: the `no-release:` line that excuses a change with no changeset is added by editing the pull request body, and the `changeset` job must re-read it.
    types: [opened, synchronize, reopened, edited]
  # A merge queue tests the queue's merge commit and waits for a check reporting on THIS event; without it a queued pull request never merges.
  merge_group:
  # A run on `main` itself, so "green on main" is a run and not an inference from a pull request's merge ref.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # THE SUITE RUNS AS FOUR SHARDS AT ONCE, through rstest's own `--shard` and a matrix. As one job it took 425 s of a 456 s job for 680 files on one 4-core runner
  # (run 38391781529, 2026-10-13), and most of that is tests that spawn processes, which no worker cap speeds up on a runner they share. rstest splits the files
  # by count, and that run's per-file times put each quarter at 95 to 115 s. `gate` needs `suite`, whose result is `success` only when every shard's is, and
  # `fail-fast` is off, so one red shard does not cancel the others before they report. A step that reads the whole tree rather than running tests runs on shard 1 only.
  # The matrix is the one place the count is written: every step reads it as `strategy.job-total`, and a script reads it by `env:`, so `ci-suite-shards.test.ts` can run it.
  suite:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      # The WHOLE history: `lib/pin-ratchet.mjs` reads the base with git from this checkout (a11ign/a11ign#3245). A `merge_group` run needs `HEAD^1`, which a depth-1
      # checkout cuts, and a pull request needs `origin/main` to take the merge-base with.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Every path a workflow names exists in this repository
        if: matrix.shard == 1
        run: node .github/scripts/workflow-paths.ts
      - name: Leak scan -- refuses a private LAN IPv4 address or a named SSH key file anywhere in the tree
        if: matrix.shard == 1
        run: node .github/scripts/leak-scan.ts
      - name: The project under test -- a11ign/a11ign at PROJECT_REF, read-only, no token beyond the job's own read-only one
        uses: actions/checkout@v7
        with:
          repository: a11ign/a11ign
          ref: ${{ env.PROJECT_REF }}
          path: project
          # The suite reads the project's git history (merge-base, branch tips, recorded commits), so a shallow clone would fail it for the wrong reason.
          fetch-depth: 0
          persist-credentials: false
      # THE LAB, LAID BY THE PROJECT'S OWN COMMAND (a11ign/a11ign#3505, `project/scripts/lay-layer.ts`): `lab` left the project's tree for the pinned tag `layers.json` declares at `PROJECT_REF`, and this lays its
      # `src/` (less its tests), scripts, baselines, `rule-ownership.json` and `CLAUDE.md` at `project/packages/lab`, where the tests' siblings and the tests that read the lab by path expect them.
      - name: The lab at the tag the project pins, laid at project/packages/lab
        working-directory: project
        run: node scripts/lay-layer.ts lab # in-project
      # `yaml` and `typescript` are the tool's own; `@rstest/core` and `@a11ign/toolchain` are the runner (a11ign/a11ign#3738). The ranges repeat `package.json`'s devDependencies,
      # because this job installs by name and not from it: move them together.
      # `@a11ign/toolchain` is EXACT, not a range (a11ign/a11ign#4308): 0.1.6 was published with no `dist/`, so the `^0.1.2` install resolved it and every `merge_group` run failed with
      # `Cannot find module '.../@a11ign/toolchain/dist/rstest-config.mjs'`. 0.7.1 ships `dist/` (its tarball holds `dist/rstest-config.mjs` and `dist/lib/git-sandbox.mjs`) and exports the `./lib/*` subpaths the
      # tool imports (`product-home`, `tree-wide-guard`, `walk-scope-declaration`, `walk-scope-discovery`, `ci-changed`, `git-sandbox`); move this pin deliberately, to a release that still does.
      # `@rspack/binding-linux-x64-gnu` is the native binding `rstest` runs on. It is an OPTIONAL dependency of `@rspack/binding`, and this install is by name with no lockfile, so npm can leave it out
      # without failing the install: the suite then exits on `Cannot find module '@rspack/binding-linux-x64-gnu'` before it lists a test file (merge_group runs 38804076077 and 38804306712, 2026-10-15).
      # So the binding is named at the version the first install resolved. It is a second install of the whole set, not an install of the binding alone: an install that names only the binding prunes the rest.
      - name: Install the tool's dependencies where the project's root would hold them
        run: |
          npm install --no-save --no-package-lock "yaml@^2.9.0" "typescript@^6.0.3" "@rstest/core@^0.12.3" "@a11ign/toolchain@0.7.1"
          BINDING=$(node -p "require('./node_modules/@rspack/binding/package.json').version")
          npm install --no-save --no-package-lock "yaml@^2.9.0" "typescript@^6.0.3" "@rstest/core@^0.12.3" "@a11ign/toolchain@0.7.1" "@rspack/binding-linux-x64-gnu@$BINDING"
          mv node_modules project/node_modules
      - name: Put this checkout's tool where the tool lives in a project, and the tests' siblings beside the tests
        run: |
          rm -rf project/packages/agent-org
          mkdir project/packages/agent-org
          cp -r src host scripts docs .github CHANGELOG.md package.json LICENSE README.md .gitignore renovate.json project/packages/agent-org/
          rsync -a --ignore-existing --exclude='*.test.ts' --exclude='*.test.mjs' project/packages/lab/src/packaging/ project/packages/agent-org/src/packaging/
          # The project deleted `project/packages/agent-org` (a11ign/a11ign#2976) and loads the tool by path (`toolModule`, a11ign/a11ign#3534). The fixture that once needed its static import
          # rewritten to reach the tool (`board-document-chrome-resolver.test.ts`) is this repository's own now, and imports `../board-document.mjs` as it stands: nothing to rewrite.
          # The tool's tests list the project's files with `git ls-files`. The laid-out copy joins the project checkout's index so they see the tool as they did when it was tracked.
          git -C project add --force --intent-to-add packages/agent-org # in-project
      # WHAT THE BODY DECLARES MUST MATCH WHAT GITHUB WILL CLOSE, FOR THIS REPOSITORY'S OWN PULL REQUESTS (a11ign/agent-org#863). The check ran only in a11ign/a11ign's `ci.yml`, whose
      # `prRepo` defaults to a11ign/a11ign, so an agent-org pull request was never put to it: a11ign/a11ign#4904 and #4906 were both agent-org pull requests (#782, #770) closed on merge and not
      # on outcome, and the refusal agent-org#838 builds could not have reached them. It is a step of `suite` and not a job of its own because `gate` already needs `suite` (a skipped or failed
      # step is a `suite` that is not `success`), and because only here is the tool laid in a project: it resolves the project's declaration at import and REFUSES, naming the field, from a bare
      # checkout of this repository. The SECOND ARGUMENT is the point: left off, the check judges the pull request number against a11ign/a11ign, a different pull request, and says "REFUSED" about
      # a body that is right here (measured 2026-10-11: #856's own body, refused without it and `ok` with it).
      # `pull_request` only: a `merge_group` or `push` run has no pull request body or number, and the pull request's own run decided before it entered the queue. `edited` is in `on:`, so a
      # body edit re-runs it. The body goes by `env:` and never argv, which is the CLI's own rule (an author's text is one opaque string). Lookup failure exits 2 (CANNOT ASK) and fails the job:
      # the check does not go quiet when the API is unwell.
      - name: The declared Closes matches what GitHub will actually close, for this repository's own pull requests (agent-org#863)
        if: github.event_name == 'pull_request' && matrix.shard == 1
        working-directory: project
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node packages/agent-org/src/closes-mismatch-check.ts ${{ github.event.pull_request.number }} ${{ github.repository }} # in-project
      - name: pnpm, which `packaging/installed-layout.test.ts` installs the tool through as a project would (a runner image carries npm, not pnpm)
        run: npm install --global pnpm@10.34.5
      # THE RUNNER IS RSTEST (a11ign/a11ign#3738, ADR 0043 Decision 3, #3549 item 3). `scripts/rstest/rstest.config.ts` is a thin call into `@a11ign/toolchain`'s shared config, run from the
      # project's root as the `node --test` line was, with the config named by its laid-out path. The build cache is on in CI only (the package's `isCi`), keyed on this repository's two inputs
      # (there is no lockfile here: the install above is by name) and printed HIT or MISS; rstest writes it under the config's root, which is the tool's directory in the project, in `node_modules/.cache/rstest-*`.
      - uses: actions/cache@v6
        id: rstest-build-cache
        with:
          path: project/packages/agent-org/node_modules/.cache/rstest-*
          # One cache per shard: a shard builds only its own files, and a key the four shared would keep whichever shard saved first.
          key: rstest-build-${{ runner.os }}-shard-${{ matrix.shard }}-of-${{ strategy.job-total }}-${{ hashFiles('package.json', 'scripts/rstest/rstest.config.ts') }}
      - name: rstest build cache HIT or MISS, printed so the run log can be quoted
        run: |
          echo "rstest build cache: ${{ steps.rstest-build-cache.outputs.cache-hit == 'true' && 'HIT' || 'MISS' }}"
      # NOTHING IS DROPPED: the files on disk must be the files rstest runs. A test file its `include` does not reach fails here, naming it, before anything runs, and would otherwise be a test that
      # silently does not run.
      - name: Every test file is run by rstest
        if: matrix.shard == 1
        working-directory: project
        env:
          SHARDS: ${{ strategy.job-total }}
        run: |
          # `comm` needs its inputs in the order `sort` made, and the two disagree about punctuation in a UTF-8 locale: byte order for both.
          export LC_ALL=C
          rstest=node_modules/.bin/rstest
          config=packages/agent-org/scripts/rstest/rstest.config.ts # in-project
          # NO_COLOR: with CI set rstest colours the list even into a pipe (the path's directory dim, the name cyan), and an escape code in front of `src/` matches nothing.
          listed=$(NO_COLOR=1 $rstest list --config "$config" --filesOnly | grep -E '^src/.*\.test\.(ts|mjs)$' | sort)
          ondisk=$(cd packages/agent-org && find src -name '*.test.ts' -o -name '*.test.mjs' | sort) # in-project
          echo "on disk: $(echo "$ondisk" | wc -l); rstest: $(echo "$listed" | wc -l)"
          missing=$(comm -23 <(echo "$ondisk") <(echo "$listed"))
          [ -z "$missing" ] || { echo "run by NO runner:"; echo "$missing"; exit 1; }
          # THE SHARDS TOGETHER ARE EVERY FILE, EACH ONCE: a file no shard lists would never run, and one two shards list would run twice.
          sharded=$(for i in $(seq 1 "$SHARDS"); do NO_COLOR=1 $rstest list --config "$config" --filesOnly --shard "$i/$SHARDS" | grep -E '^src/.*\.test\.(ts|mjs)$'; done | sort)
          [ "$sharded" = "$listed" ] || { echo "the shards do not list every file exactly once:"; diff <(echo "$listed") <(echo "$sharded"); exit 1; }
      - name: The tool's suite under rstest -- this shard's share of every *.test.ts and *.test.mjs, run from the project's root, with --trace
        working-directory: project
        env:
          # The copy above has no `.git`, so a pinned population cannot read its base from where it sits. This is the checkout it was copied from, and the one place
          # that names it (`TOOL_REPO_ENV` in `lib/pin-ratchet.mjs`); without it the pins are judged STRICTLY, every entry declared and nothing grandfathered.
          AGENT_ORG_TOOL_REPO: ${{ github.workspace }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: node_modules/.bin/rstest run --config packages/agent-org/scripts/rstest/rstest.config.ts --trace --shard "$SHARD/$SHARDS" # in-project
      # A CACHE THAT IS NEVER WRITTEN RESTORES NOTHING AND STILL READS GREEN (a11ign/a11ign#1319): the build cache is on, so the directory must now hold files, or the HIT or MISS line above describes
      # a cache that does not exist.
      - name: rstest build cache must hold files after the tests
        working-directory: project/packages/agent-org # in-project
        run: |
          files=$( (find node_modules/.cache -path 'node_modules/.cache/rstest-*' -type f 2>/dev/null || true) | wc -l)
          echo "files under node_modules/.cache/rstest-* after the tests: $files"
          [ "$files" -gt 0 ] || { echo "rstest ran with performance.buildCache on and wrote no cache files"; exit 1; }
      # ADR 0043: "CI runs `rstest run --trace` once, the summary archived as an artifact", the per-phase split and the top 10 files that a speed-up is read from.
      # One summary per shard, each of its own share: an artifact name may be uploaded once per run.
      - name: The trace summary, archived
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rstest-trace-${{ matrix.shard }}
          # `.rstest` is a hidden directory, which neither `**` nor the action's default reaches: the first run of this step matched no file, said so in a warning, and uploaded nothing.
          path: project/packages/agent-org/.rstest/trace-*.summary.md
          include-hidden-files: true
          if-no-files-found: warn

  # THE TYPECHECK (a11ign/a11ign#3551, toolchain row 4a of #3550). `tsc` ran nowhere in this repository: 217 of its 244 `.mjs` files carry `// @ts-check` and 226 files are
  # `*.test.ts`, and none of it was checked, so a wrong JSDoc type and a test calling a function wrongly passed review and the suite alike. `tsconfig.json` is the program; its
  # `exclude` names the files NOT yet clean, so a new file is checked from its first commit and the list can only shrink. A file that is imported by an included one is checked
  # whether it is excluded or not (TypeScript follows imports), which is why `tsconfig.json` names only files nothing included reaches.
  #
  # IT IS A SEPARATE JOB, NOT A STEP OF `suite`: `suite` waits minutes for the whole suite and a type error should not cost that wait, so it runs beside it. It runs on the same three events,
  # because a merge queue waits for a check reporting on `merge_group`. It is REQUIRED through `gate`, the last job, which needs it (a11ign/a11ign#3986); no repository setting is involved.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Install the dev dependencies the program imports types from (typescript, @types/node, yaml)
        # The toolchain is named EXACT beside `package.json`'s range for the same reason as in `suite` (a11ign/a11ign#4308): a range once resolved 0.1.6, which has no `dist/`.
        run: npm install --no-package-lock --no-save "@a11ign/toolchain@0.7.1"
      - name: tsc --noEmit over tsconfig.json
        run: npm run typecheck
      # THE LAYOUT CHECK (a11ign/a11ign#4211, ADR 0043 Decision 7; the check is a11ign/a11ign#4210, published in `@a11ign/toolchain`). This repository is the standard's model -- one package at the root, one
      # README, no workspace file -- so the step is the negative control that lives in a real repository: it must PASS here, and a change that makes this a monorepo would turn `gate` red. It runs in this job
      # because `gate` waits for it and the install above already holds the pinned `@a11ign/toolchain`. At 0.7.1 `dist/layout-check.mjs` begins `#!/usr/bin/env node`, so the published one-liner
      # (`npx --package @a11ign/toolchain layout-check`) can run it; this step still calls it by path, which needs no `npx` resolution and fires the same file's main guard.
      - name: The layout check -- a single-package repository has its package at the root, with no workspace file
        run: node node_modules/@a11ign/toolchain/dist/layout-check.mjs
      # THE PROGRAM MUST NOT SHRINK QUIETLY: a typecheck that passes because `exclude` grew, or `include` stopped matching, is a check that checks nothing. 429 files were in the
      # program when this job was added (201 of the 227 `*.test.ts`, 195 of the 219 `@ts-check` `.mjs`) and 473 once the burn-down of a11ign/a11ign#3571 left four files in `exclude`; the
      # floor is below that so a deletion does not trip it, and an `exclude` that swallows a hundred files does. Raise it as the list shrinks.
      - name: The program still holds the files it was added to check
        run: |
          count=$(npx tsc --noEmit -p tsconfig.json --listFilesOnly | grep -vc node_modules)
          echo "tsc program: $count files outside node_modules"
          test "$count" -ge 440

  # A PULL REQUEST THAT CHANGES `src/` MUST CARRY A CHANGESET OR A `no-release:` LINE (a11ign/a11ign#4084, adoption row #4129 of the shared check #4127). screenreader-worker#25 and #26 merged
  # shipped code with no changeset and nothing released them; this repository's per-merge release releases a changeset, so a change with none is invisible to it. The decision lives in
  # a11ign/toolchain's `changeset-required.yml`, pinned by FULL SHA (Dependabot's `github-actions` entry moves the pin); this job only names the paths.
  #
  # `releasable-paths` IS THE `dora` ENTRY's `releasablePaths` for a11ign/agent-org in a11ign/a11ign `.agent-org/project.json`, joined by a space: a path that matches nothing passes every
  # pull request, so move this value when that entry moves. `permissions` is the caller's to grant: a called workflow cannot hold more than its caller gives, and without them the whole
  # run is a `startup_failure`. On a `merge_group` entry the called job SUCCEEDS WITHOUT EVALUATING (the pull request's own run decided), so `gate` below stays green in the queue.
  changeset:
    # A PUSH TO `main` HAS NO PULL REQUEST TO DECIDE (a11ign/a11ign#4139): the shared workflow reads the pull request's files through the API from `github.event.pull_request.number`, which is
    # empty on a push, so it asks for `pulls//files` and GitHub answers 404 -- `main` was red on every push from the adoption's merge (`9e0d2d56`). The pull request's own run decided the change
    # before it merged, so the job does not run here and `gate` accepts that skip on a push and nowhere else. The better home for this answer is the shared workflow (a11ign/a11ign#4140).
    if: github.event_name != 'push'
    permissions:
      contents: read
      pull-requests: read
    uses: a11ign/toolchain/.github/workflows/changeset-required.yml@745b552ed550f44cc15c9d797718d350730540ce
    with:
      releasable-paths: src/

  # A PULL REQUEST THAT CHANGES HOW THIS TREE INSTALLS DRY-RUNS THE RELEASE'S VERSION STEP (agent-org#888; chairman, agent-org#885 class 3 and a11ign/a11ign#4988). agent-org#871 changed the install, passed
  # this file's `suite`, and the first sign of the break was five failed releases on `main`: nothing on the pull request ran the path the release takes (`release-per-merge.yml`'s `version` job: with
  # a lockfile, `pnpm install --frozen-lockfile`, the repository's OWN `changeset version`, then `pnpm install --lockfile-only`; without one, `pnpm dlx @changesets/cli@<changesets-version> version`).
  # This job runs those commands, in a scratch clone of the candidate tree, and writes nothing: `contents: read`, no credential kept by the checkout, no push, no token.
  #
  # IT RUNS ON EVERY EVENT AND DOES ITS WORK ONLY WHEN THE CHANGE TOUCHES `package.json`, `pnpm-lock.yaml`, `.npmrc` OR `.github/workflows/`. GitHub filters `paths:` per WORKFLOW and not per job, and a
  # workflow-wide filter would skip `gate` with it, so the job reads the paths itself and the steps after `touched` are conditional on it: an untouched change is a `success` here, never a skip, and `gate`
  # keeps accepting `success` alone. The paths are judged against the first parent of the checked-out commit: the merge ref of a pull request, a merge-queue entry, or a push to `main`.
  #
  # THE SECOND STEP IS THE CONSUMER'S INSTALL (a11ign/a11ign#4988): agent-org must not publish a tag its consumer cannot install. a11ign's `agent-org-newest-tag` script (its `installToolDependencies`)
  # clones the tag and, when it carries `pnpm-lock.yaml`, runs `npx pnpm@<TOOL_PNPM_VERSION> install --frozen-lockfile --ignore-scripts` (the pnpm this repository's `release.yml` pins), else
  # `npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund`. The step is that, on a clone of the candidate commit. It cannot see a change in a11ign's script, and a change here that
  # makes the clone uninstallable fails it.
  #
  # THE TOOLS ARE THE RELEASE'S, NOT THIS FILE'S: `PNPM_VERSION`, `CHANGESETS_VERSION` and the Node below repeat `release.yml`'s `pnpm-version`, `changesets-version` and `node-version`, and
  # `src/packaging/release-dry-run.test.ts` fails when they differ, so a dry run is never a pass on a toolchain the release does not use. It versions EVERY changeset in the tree, where the release
  # versions only those no tag has consumed: a superset, so a failure the release would meet is met here (the release's `plan` step reads which changesets a tag consumed; this job has no such step and does not need one to reach the same install and `changeset version`).
  #
  # THE CHECKOUT AND THE VERSION STEP'S CLONE ARE FULL-DEPTH (ceo review of agent-org#967: the first run hung 29 minutes in the version step). `changeset version` reads git history and DEEPENS a shallow clone, and on a `--depth=1` one it spins; screenreader-fleet#33, screenreader-worker#47 and toolchain#40 fixed the same hang with `fetch-depth: 0` and a clone without `--depth=1`. The consumer's install runs no `changeset`, so its clone keeps `--depth=1`, as a11ign's own does of a tag.
  release-dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PNPM_VERSION: 10.34.5
      CHANGESETS_VERSION: 3.0.1
    steps:
      - uses: actions/checkout@v7
        with:
          # The WHOLE history, not two commits: `touched` needs only HEAD and its first parent, but the version step clones this checkout and `changeset version` deepens a shallow clone and hangs (see the job's header).
          # No credential is kept: nothing here pushes.
          fetch-depth: 0
          persist-credentials: false
      - name: Does the change touch what the release installs from?
        id: touched
        run: |
          set -euo pipefail
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "changed paths:"
          echo "$changed"
          if grep -q -E '^(package\.json|pnpm-lock\.yaml|\.npmrc)$|^\.github/workflows/' <<<"$changed"; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
            echo "no install-affecting path changed: the release dry run is not needed"
          fi
      - uses: pnpm/action-setup@v6
        if: steps.touched.outputs.touched == 'true'
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        if: steps.touched.outputs.touched == 'true'
        with:
          node-version: 22.22.1
      - name: The release's version step, dry-run on a scratch clone -- install, changeset version, lockfile refresh
        if: steps.touched.outputs.touched == 'true'
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/release-dry-run"
          git clone --quiet "file://$GITHUB_WORKSPACE" "$scratch"
          cd "$scratch"
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
            pnpm exec changeset version
            pnpm install --lockfile-only
          else
            pnpm dlx "@changesets/cli@$CHANGESETS_VERSION" version
          fi
      - name: The consumer's install of the candidate tree -- what a11ign's agent-org-newest-tag runs on a tag
        if: steps.touched.outputs.touched == 'true'
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/consumer-install"
          git clone --quiet --depth=1 "file://$GITHUB_WORKSPACE" "$consumer"
          cd "$consumer"
          if [ -f pnpm-lock.yaml ]; then
            npx "pnpm@$PNPM_VERSION" install --frozen-lockfile --ignore-scripts
          else
            npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund
          fi

  # THE ONE CONTEXT `main` REQUIRES (a11ign/a11ign#3986), and the only way `typecheck` is required without an admin's act. `typecheck` is a job of its own so a type error does not wait
  # for the suite, but a job nobody requires is advisory: `rules/branches/main` listed `gate` alone and whether classic protection listed `typecheck` is admin-only to read, so the
  # repository-settings table read it CANNOT_TELL. Requiring it by a `needs:` on `gate` puts it where any token reads it, and keeps the name every other reader
  # of `gate` already holds (`release.yml`'s `gate-check`, `auto-arm.yml`).
  #
  # `if: always() && !cancelled()` IS THE POINT, not decoration: with the default `success()` a failing `typecheck` SKIPS `gate`, and a skipped required check counts as passing, so a type
  # error would merge. The same form as a11ign/a11ign's own `gate`. Unlike that one, `skipped` is accepted in ONE place: `changeset` on a `push`, where it carries an `if:` that is
  # false by design (a push has no pull request; a11ign/a11ign#4139). Everywhere else a skip means a job that did not run for a reason nobody wrote, so on `pull_request` and
  # `merge_group` the only green is `success` from all four, and `suite` and `typecheck` must be `success` on a push too.
  gate:
    needs: [suite, typecheck, changeset, release-dry-run]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: The suite, the typecheck, the changeset check and the release dry run all succeeded
        env:
          EVENT: ${{ github.event_name }}
        run: |
          changeset="${{ needs.changeset.result }}"
          if [ "$EVENT" = "push" ] && [ "$changeset" = "skipped" ]; then changeset="success"; fi
          for result in "${{ needs.suite.result }}" "${{ needs.typecheck.result }}" "$changeset" "${{ needs.release-dry-run.result }}"; do
            [ "$result" = "success" ] || { echo "::error::a job reported '$result', not success"; exit 1; }
          done
