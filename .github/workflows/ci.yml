name: ci

# THE REQUIRED CHECK IS `gate` (a11ign/a11ign#2792; ADR 0040 decision 6 step 6). A check name can be required only after it has run once,
# and this file's first pull request is that run.
#
# `gate` RUNS THE TOOL'S WHOLE TEST SUITE (a11ign/a11ign#2973, cut-over 2 of 6), because after the cut this repository is the only place the tool's
# tests can run and "fix forward, no rollback copy" is safe only with a gate that can go red. The suite cannot run in this tree alone: the tool reads
# `.agent-org/project.json` and walks the project it is pointed at, and when that was tried here without one, 158 of 464 subtests failed and 60 of
# 125 modules did not import, all for that reason. So the job takes ROUTE (a) of the row: it checks out the project under test,
# a11ign/a11ign (public) at $PROJECT_REF, into `project/`, puts this checkout's tool where the tool lives in a project (`project/packages/agent-org`)
# and runs the suite from the project's root. Route (b), a fixture project inside this repository (ADR 0040 decision 8), does not exist yet, and the
# suite reads the project's real tree (its rules files, its `.agent-org/`, its git history) in ways a fixture would have to reproduce.
#
# WHAT `gate` CANNOT PROVE (decision 8's limit): it proves the tool against ONE project, a11ign, at the ref named below -- not against any other
# project's declaration -- and the project moves on its own, so a red `gate` can be the project's change and not the pull request's. Pin
# PROJECT_REF to a commit to separate the two.
#
# THE TESTS' SIBLINGS COME FROM THE PROJECT: the tool's tests were extracted from the project's lab package (`project/packages/lab/src/packaging/`), where they sat beside helper
# modules and fixtures that were not extracted. The job copies those siblings (never a test) from the project beside the tests, without overwriting
# anything this repository has.
#
# NODE IS PINNED TO 22.22.1, NOT `22`: on 22.23.3 (what `22` resolved to on 2026-10-02) the suite's one tree-walking observer, `walk-scope.mjs`, sees
# tsx probe `<name>.mts` beside every `<name>.mjs` it imports and fails `board-reported-data-integrity.test.ts` for reads outside its declared scope
# (reproduced locally on both versions, 22.22.1 green and 22.23.3 red, same tree). Move the pin only by re-running the suite on the new version.
#
# NAMING A PATH THAT LIVES IN THE PROJECT: `workflow-paths.mjs` refuses a workflow path (`packages/...`, `scripts/...`) that is not in THIS
# repository, so a path in the project is written with the `project/` prefix, or carries the marker `# in-project` at the end of its line.
#
# EVERY TEST THE SUITE HOLDS RUNS, UNDER ONE OF TWO RUNNERS (a11ign/a11ign#3738): rstest runs the files that converted, and `node --test` runs the ones in `NOT_YET_CONVERTED` (scripts/rstest/rstest.config.mjs), each
# named there with the reason it did not convert. A step counts the two sets against the files on disk. The runs report `skipped 1` between them (the test that needs the `codex` binary, which skips itself).
# Four tests whose premise was the monorepo's directory layout were once skipped by name (a11ign/a11ign#2973) and are now fixed in the tests (#3002):
# an exclusion is a test that does not run, so a defect in what it guards would have gone unseen.

env:
  # The project the tool is tested against. `main` follows the project; a commit hash holds it still.
  PROJECT_REF: main

on:
  pull_request:
    branches: [main]
  # A merge queue tests the queue's merge commit and waits for a check reporting on THIS event; without it a queued pull request never merges.
  merge_group:
  # A run on `main` itself, so "green on main" is a run and not an inference from a pull request's merge ref.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # The WHOLE history: `lib/pin-ratchet.mjs` reads the base with git from this checkout (a11ign/a11ign#3245). A `merge_group` run needs `HEAD^1`, which a depth-1
      # checkout cuts, and a pull request needs `origin/main` to take the merge-base with.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
      - name: Every path a workflow names exists in this repository
        run: node .github/scripts/workflow-paths.mjs
      - name: Leak scan -- refuses a private LAN IPv4 address or a named SSH key file anywhere in the tree
        run: node .github/scripts/leak-scan.mjs
      - name: The project under test -- a11ign/a11ign at PROJECT_REF, read-only, no token beyond the job's own read-only one
        uses: actions/checkout@v4
        with:
          repository: a11ign/a11ign
          ref: ${{ env.PROJECT_REF }}
          path: project
          # The suite reads the project's git history (merge-base, branch tips, recorded commits), so a shallow clone would fail it for the wrong reason.
          fetch-depth: 0
          persist-credentials: false
      # `tsx`, `yaml` and `typescript` are the tool's own; `@rstest/core` and `@a11ign/toolchain` are the runner (a11ign/a11ign#3738). The ranges repeat `package.json`'s devDependencies,
      # because this job installs by name and not from it: move them together. `tsx` stays for the files `NOT_YET_CONVERTED` (scripts/rstest/rstest.config.mjs) still run under `node --test`.
      - name: Install the tool's dependencies where the project's root would hold them
        run: |
          npm install --no-save --no-package-lock "tsx@^4.22.4" "yaml@^2.9.0" "typescript@^6.0.3" "@rstest/core@^0.12.3" "@a11ign/toolchain@^0.1.2"
          mv node_modules project/node_modules
      - name: Put this checkout's tool where the tool lives in a project, and the tests' siblings beside the tests
        run: |
          rm -rf project/packages/agent-org
          mkdir project/packages/agent-org
          cp -r src host scripts .github CHANGELOG.md package.json LICENSE README.md project/packages/agent-org/
          rsync -a --ignore-existing --exclude='*.test.ts' --exclude='*.test.mjs' project/packages/lab/src/packaging/ project/packages/agent-org/src/packaging/
          # Two compensations for the project having deleted `project/packages/agent-org` (a11ign/a11ign#2976), the same words as the project's own `agentOrg` job so the two cannot drift.
          # The project loads the tool by path (`toolModule`, a11ign/a11ign#3534). The tool's own tests read this fixture's STATIC imports, as relative paths into
          # `project/packages/agent-org`, where the tool lived when #2976 removed it, so this runner (and no committed file) spells the import that way.
          # The `grep -q` is the proof: a `sed` that matched nothing must fail the step, not pass it.
          fixture=project/packages/lab/src/packaging/board-document-chrome-resolver.test.ts
          sed -i 's#^const {\(.*\)} = await toolModule("src/board-document.mjs");#import {\1} from "../../../agent-org/src/board-document.mjs";#' "$fixture"
          grep -q 'from "../../../agent-org/src/board-document.mjs"' "$fixture"
          # The tool's tests list the project's files with `git ls-files`. The laid-out copy joins the project checkout's index so they see the tool as they did when it was tracked.
          git -C project add --force --intent-to-add packages/agent-org # in-project
      - name: pnpm, which `packaging/installed-layout.test.ts` installs the tool through as a project would (a runner image carries npm, not pnpm)
        run: npm install --global pnpm@10.34.5
      # THE RUNNER IS RSTEST (a11ign/a11ign#3738, ADR 0043 Decision 3, #3549 item 3). `scripts/rstest/rstest.config.mjs` is a thin call into `@a11ign/toolchain`'s shared config, run from the
      # project's root as the `node --test` line was, with the config named by its laid-out path. The build cache is on in CI only (the package's `isCi`), keyed on this repository's two inputs
      # (there is no lockfile here: the install above is by name) and printed HIT or MISS; rstest writes it under the config's root, which is the tool's directory in the project, in `node_modules/.cache/rstest-*`.
      - uses: actions/cache@v6
        id: rstest-build-cache
        with:
          path: project/packages/agent-org/node_modules/.cache/rstest-*
          key: rstest-build-${{ runner.os }}-${{ hashFiles('package.json', 'scripts/rstest/rstest.config.mjs') }}
      - name: rstest build cache HIT or MISS, printed so the run log can be quoted
        run: |
          echo "rstest build cache: ${{ steps.rstest-build-cache.outputs.cache-hit == 'true' && 'HIT' || 'MISS' }}"
      # NOTHING IS DROPPED BETWEEN THE TWO RUNNERS: the files on disk must be the files rstest runs plus `NOT_YET_CONVERTED`, which the next steps run under `node --test`. A test file in neither fails
      # here, naming it, before anything runs: an `exclude` that outgrew its list would otherwise be a test that silently does not run.
      - name: Every test file is run by exactly one runner
        working-directory: project
        run: |
          # `comm` needs its inputs in the order `sort` made, and the two disagree about punctuation in a UTF-8 locale: byte order for both.
          export LC_ALL=C
          rstest=node_modules/.bin/rstest
          config=packages/agent-org/scripts/rstest/rstest.config.mjs # in-project
          unconverted=$(node -e 'import(process.argv[1]).then((m) => console.log(m.NOT_YET_CONVERTED.join("\n")))' "$PWD/$config" | sort)
          # NO_COLOR: with CI set rstest colours the list even into a pipe (the path's directory dim, the name cyan), and an escape code in front of `src/` matches nothing.
          converted=$(NO_COLOR=1 $rstest list --config "$config" --filesOnly | grep -E '^src/.*\.test\.(ts|mjs)$' | sort)
          ondisk=$(cd packages/agent-org && find src -name '*.test.ts' -o -name '*.test.mjs' | sort) # in-project
          echo "on disk: $(echo "$ondisk" | wc -l); rstest: $(echo "$converted" | wc -l); node --test (NOT_YET_CONVERTED): $(echo "$unconverted" | wc -l)"
          missing=$(comm -23 <(echo "$ondisk") <(printf '%s\n%s\n' "$converted" "$unconverted" | sort -u))
          doubled=$(comm -12 <(echo "$converted") <(echo "$unconverted"))
          stale=$(comm -13 <(echo "$ondisk") <(echo "$unconverted"))
          [ -z "$missing" ] || { echo "run by NO runner:"; echo "$missing"; exit 1; }
          [ -z "$stale" ] || { echo "NOT_YET_CONVERTED names a file that is not there (a converted or deleted file keeps its line):"; echo "$stale"; exit 1; }
          [ -z "$doubled" ] || { echo "run by BOTH runners:"; echo "$doubled"; exit 1; }
      - name: The tool's suite under rstest -- every converted *.test.ts and *.test.mjs, run from the project's root, with --trace
        working-directory: project
        env:
          # The copy above has no `.git`, so a pinned population cannot read its base from where it sits. This is the checkout it was copied from, and the one place
          # that names it (`TOOL_REPO_ENV` in `lib/pin-ratchet.mjs`); without it the pins are judged STRICTLY, every entry declared and nothing grandfathered.
          AGENT_ORG_TOOL_REPO: ${{ github.workspace }}
        run: node_modules/.bin/rstest run --config packages/agent-org/scripts/rstest/rstest.config.mjs --trace # in-project
      # A CACHE THAT IS NEVER WRITTEN RESTORES NOTHING AND STILL READS GREEN (a11ign/a11ign#1319): the build cache is on, so the directory must now hold files, or the HIT or MISS line above describes
      # a cache that does not exist.
      - name: rstest build cache must hold files after the tests
        working-directory: project/packages/agent-org # in-project
        run: |
          files=$( (find node_modules/.cache -path 'node_modules/.cache/rstest-*' -type f 2>/dev/null || true) | wc -l)
          echo "files under node_modules/.cache/rstest-* after the tests: $files"
          [ "$files" -gt 0 ] || { echo "rstest ran with performance.buildCache on and wrote no cache files"; exit 1; }
      - name: The files that have not converted yet, under node --test (NOT_YET_CONVERTED, scripts/rstest/rstest.config.mjs)
        working-directory: project
        env:
          AGENT_ORG_TOOL_REPO: ${{ github.workspace }}
        run: |
          files=$(node -e 'import(process.argv[1]).then((m) => console.log(m.NOT_YET_CONVERTED.map((f) => "packages/agent-org/" + f).join(" ")))' "$PWD/packages/agent-org/scripts/rstest/rstest.config.mjs") # in-project
          node --import tsx --test $files
      # ADR 0043: "CI runs `rstest run --trace` once, the summary archived as an artifact", the per-phase split and the top 10 files that a speed-up is read from.
      - name: The trace summary, archived
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rstest-trace
          path: project/**/.rstest/trace-*.summary.md
          if-no-files-found: warn

  # THE TYPECHECK (a11ign/a11ign#3551, toolchain row 4a of #3550). `tsc` ran nowhere in this repository: 217 of its 244 `.mjs` files carry `// @ts-check` and 226 files are
  # `*.test.ts`, and none of it was checked, so a wrong JSDoc type and a test calling a function wrongly passed review and the suite alike. `tsconfig.json` is the program; its
  # `exclude` names the files NOT yet clean, so a new file is checked from its first commit and the list can only shrink. A file that is imported by an included one is checked
  # whether it is excluded or not (TypeScript follows imports), which is why `tsconfig.json` names only files nothing included reaches.
  #
  # IT IS A SEPARATE JOB, NOT A STEP OF `gate`: `gate` waits minutes for the whole suite and a type error should not cost that wait, and a required check is a JOB name, so a job of
  # its own is the only way `main` can demand it without demanding the suite twice. It runs on the same three events as `gate`, because a merge queue waits for a check reporting on
  # `merge_group`. Making it REQUIRED is a repository setting, not this file's (see the pull request that added it for who sets it and the read-back).
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
      - name: Install the dev dependencies the program imports types from (typescript, @types/node, yaml, tsx)
        run: npm install --no-package-lock
      - name: tsc --noEmit over tsconfig.json
        run: npm run typecheck
      # THE PROGRAM MUST NOT SHRINK QUIETLY: a typecheck that passes because `exclude` grew, or `include` stopped matching, is a check that checks nothing. 429 files were in the
      # program when this job was added (201 of the 227 `*.test.ts`, 195 of the 219 `@ts-check` `.mjs`) and 473 once the burn-down of a11ign/a11ign#3571 left four files in `exclude`; the
      # floor is below that so a deletion does not trip it, and an `exclude` that swallows a hundred files does. Raise it as the list shrinks.
      - name: The program still holds the files it was added to check
        run: |
          count=$(npx tsc --noEmit -p tsconfig.json --listFilesOnly | grep -vc node_modules)
          echo "tsc program: $count files outside node_modules"
          test "$count" -ge 440
