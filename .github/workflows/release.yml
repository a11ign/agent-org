name: release

# A RELEASE IS A GIT TAG, AND NOTHING ELSE (a11ign/a11ign#3069, #3134, #3187; chairman, a11ign/a11ign#928, 2026-10-03). agent-org is published to NO registry: a project takes
# `github:a11ign/agent-org#semver:^0.1.0`, which pnpm resolves against the tags of this repository, and the host that runs the org runs the newest `vX.Y.Z` tag (`update-tool`
# checks it out; `host.json`'s `toolVersion` pins one instead, which is the whole of a rollback). So whoever lets a merge release is deciding what a project's CI installs AND what
# the running org does.
#
# THE STEPS ARE NOT HERE ANY MORE (a11ign/a11ign#3965, #3958; chairman, #928, 2026-10-07). This file is a CALLER of the one per-merge workflow every repository of the organisation
# shares, `release-per-merge.yml` in a11ign/toolchain, which does what this file used to do in its own steps: the gate waited for on the exact sha, the release commit on no branch
# (the last tag's version and changelog, the released changesets removed, then `changeset version`), the tag pushed atomically and never forced, and the Release carrying the
# CHANGELOG entry. Nothing is written to `main`, and `main`'s version and CHANGELOG.md lag the last tag, as before. Its behaviour is tested THERE (`release-parity.test.ts`,
# `release-per-merge.test.ts`); what only this call can get wrong is pinned HERE, by `release-triggers-itself.test.ts` (trigger, permissions, concurrency, what the call reaches)
# and `release-tag-on-merge.test.ts` (the pin and the inputs).
#
# THE PIN IS A FULL SHA, because a tag or a branch would let a push to toolchain change what this repository releases with no pull request here; Dependabot's `github-actions`
# entry moves it in a pull request that is reviewed. THE INPUTS: `kind: tag` (no registry, and no OIDC token is minted), `gate-check: gate` (ci.yml's required check),
# `node-version` as this file always ran, `pnpm-version` and `changesets-version`. agent-org has a tracked `pnpm-lock.yaml` and NO `packageManager`, and the shared workflow reads the two inputs differently
# for that (`release-per-merge.yml` at the pinned sha: "pnpm itself comes from `packageManager`, else from the `pnpm-version` input, and a repository with neither is refused by name"; "With [a lockfile],
# `version` runs `pnpm install --frozen-lockfile` and the repository's own `changeset`. Without, it ... runs `pnpm dlx @changesets/cli@<changesets-version>`"). So `pnpm-version` is LIVE, because there is no
# `packageManager`; `changesets-version` is IGNORED while the lockfile stands, and is the fallback that would run if it were removed, so it names the `@changesets/cli` the lockfile installs (3.0.1, also
# package.json's `changeset` script). `release-tag-on-merge.test.ts` pins both and fails if the lockfile stops locking that version or a `packageManager` appears.
#
# `id-token: write` IS HELD BY THE CALL, AND NOTHING IS MINTED WITH IT (ceo review of a11ign/agent-org#352). The called file's `publish` job asks for `id-token: write`, and GitHub checks a
# called workflow's job permissions against the caller's when the workflow is LOADED, not against a job's `if:`: a caller that withholds it fails the whole call before any job runs,
# `publish` skipped or not. Under `kind: tag` that job is skipped, so no token is minted (and `publish` sits in the `npm-publish` environment, restricted to `main`). The pair is pinned
# by `release-triggers-itself.test.ts`: the grant is on the call only, and only beside `kind: tag`. Not run before merge: the first run on `main` is its reading.
#
# THE CONSUMER IS CHECKED BEFORE THE TAG (a11ign/a11ign#4407 b, #4412). v0.88.0 renamed `src/*.mjs` to `.ts` and was tagged, and every a11ign pull request's `acceptance / run` then threw
# `ERR_MODULE_NOT_FOUND`: nothing between the merge and the tag asked whether the project that installs the tag still works against it. `consumer-check` is that question, and `release`
# `needs` it, so a red check leaves the tag uncut and the merge unreleased. It runs two steps in this order: `src/public-interface.test.ts` (the declared `exports` and `bin` still deliver every
# name a project is declared to use), then `src/release-consumer-check.test.ts` against a11ign/a11ign's CURRENT `main` (what the project imports through `agent-org/<subpath>` is a subset of
# that declaration). `main` and not a pin, because the point is how the project calls the tool NOW; the price is that a project change can hold this repository's release, which is the
# warning working. `src/release-consumer-check.test.ts` pins the job, its order, the `needs`, and that nothing (`if:`, `continue-on-error`) excuses it.
#
# A push that arrives while another run is waiting REPLACES the waiting run (GitHub keeps one). That is harmless: every run reads the unreleased changesets from its own tree.
# A tag pushed with GITHUB_TOKEN starts no workflow, and `on` here names branches only.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # `contents: read` alone: the check reads two public trees and writes nothing, and the tag is `release`'s to cut.
  consumer-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: The consumer -- a11ign/a11ign at main, read-only, into consumer/
        uses: actions/checkout@v7
        with:
          repository: a11ign/a11ign
          ref: main
          path: consumer
          persist-credentials: false
      # By name, as ci.yml's `suite` does (no lockfile here): Node 24 runs the `.ts` programs itself, `typescript` reads each declared module's exports, `yaml` parses the workflow the second test pins.
      - name: Install the dependencies the two tests import
        run: npm install --no-save --no-package-lock "typescript@^6.0.3" "yaml@^2.9.0"
      - name: The public-interface check -- every declared subpath and name is still delivered
        run: node --test src/public-interface.test.ts
      - name: The consumer check -- what a11ign imports is a subset of the declared interface
        env:
          A11IGN_CHECKOUT: ${{ github.workspace }}/consumer
        run: node --test src/release-consumer-check.test.ts

  release:
    needs: consumer-check
    permissions:
      # The tag and the Release are the only writes. No `pull-requests`, and no registry token anywhere.
      contents: write
      checks: read
      # Required to LOAD the call (see the header): the called `publish` job asks for it, and `kind: tag` skips that job, so nothing is minted.
      id-token: write
    concurrency:
      group: release
      cancel-in-progress: false
    uses: a11ign/toolchain/.github/workflows/release-per-merge.yml@08fcafc094e6b45c993f7754f0dcfd259c96be93
    with:
      kind: tag
      gate-check: gate
      node-version: 22.22.1
      pnpm-version: 10.34.5
      changesets-version: 3.0.1

  # THE UI BUILD, BUILT FOR THE RELEASE JUST CUT AND ATTACHED TO ITS GITHUB RELEASE (A11-191; parent A11-187: CI builds the UI into each release, so no machine needs its toolchain). The shared workflow above
  # declares NO `workflow_call` outputs, so the call is never told which tag it cut, and a tag pushed with GITHUB_TOKEN starts no workflow (`on: release` and `on: push: tags` never fire). So the two jobs
  # below follow the call in this file, and `scripts/ui-asset.ts released-tag` finds the tag from the one thing both know: the shared workflow builds the release commit "on top of this merge", so the `vX.Y.Z`
  # tag whose commit has `$GITHUB_SHA` as its FIRST PARENT is the tag this push released. A push that released nothing (no unreleased changeset) matches no tag, says so, and ends green.
  #
  # BUILD AND ATTACH ARE TWO JOBS because the build RUNS THE REPOSITORY'S CODE (`pnpm install` of `ui/`) and so holds no write token, as the shared workflow's own `version` job holds none; the job that
  # holds `contents: write` runs none of the repository's code: it downloads two files and uploads them. `ui-build` hands them on as a run artifact.
  #
  # THE DRY RUN IS `ci.yml`'s `ui` JOB: it runs the same install, build and `ui-asset.ts pack` on every pull request (`ASSET_TAG: dry-run`) and archives the two files as `agent-org-ui-dry-run`, uploading nothing to a
  # Release. `src/packaging/ui-asset.test.ts` holds the three commands of the two jobs equal.
  #
  # THE UPLOAD ADDS AND NEVER REPLACES: `gh release upload` with no `--clobber`, the tarball first and its checksum second, so a checksum that is there always has its tarball. A re-run that finds both already
  # attached says so and succeeds; one that finds only one fails and names it, because replacing a file a machine may already have verified is a person's decision. `release-triggers-itself.test.ts` allows exactly
  # these two uploads and still refuses every other `gh release` write.
  ui-build:
    needs: release
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PNPM_VERSION: 10.34.5
      ASTRO_TELEMETRY_DISABLED: 1
    outputs:
      tag: ${{ steps.released.outputs.tag }}
    steps:
      # Every tag, and the parent of every commit a tag points at, must be here: the release commit is on no branch, and the tag job pushed it before this job began.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: The tag this push released, if it released one
        id: released
        run: |
          tag=$(node scripts/ui-asset.ts released-tag "$GITHUB_SHA")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then echo "$GITHUB_SHA released no tag, so there is no UI build to attach"; else echo "$GITHUB_SHA released $tag"; fi
      - name: Check out the release
        if: steps.released.outputs.tag != ''
        env:
          ASSET_TAG: ${{ steps.released.outputs.tag }}
        run: git checkout --detach "refs/tags/$ASSET_TAG"
      - uses: pnpm/action-setup@v6
        if: steps.released.outputs.tag != ''
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install the UI from its own lockfile
        if: steps.released.outputs.tag != ''
        run: pnpm --dir ui install --frozen-lockfile --ignore-scripts
      - name: pnpm ui:build -- static files in ui/dist
        if: steps.released.outputs.tag != ''
        run: pnpm ui:build
      - name: Pack the UI asset -- agent-org-ui-<tag>.tar.gz and its sha256
        if: steps.released.outputs.tag != ''
        env:
          ASSET_TAG: ${{ steps.released.outputs.tag }}
        run: node scripts/ui-asset.ts pack ui/dist "$ASSET_TAG" "$RUNNER_TEMP/ui-asset"
      - name: The two files, handed to the job that attaches them
        if: steps.released.outputs.tag != ''
        uses: actions/upload-artifact@v7
        with:
          name: agent-org-ui
          path: ${{ runner.temp }}/ui-asset/*
          if-no-files-found: error
          retention-days: 1

  ui-attach:
    needs: ui-build
    if: needs.ui-build.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      # The Release's assets are the only write. This job runs no repository code: it checks nothing out.
      contents: write
    env:
      ASSET_TAG: ${{ needs.ui-build.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: agent-org-ui
          path: ${{ runner.temp }}/ui-asset
      - name: Attach the tarball, then its checksum, to the Release
        working-directory: ${{ runner.temp }}/ui-asset
        run: |
          tarball="agent-org-ui-$ASSET_TAG.tar.gz"
          checksum="$tarball.sha256"
          attached=$(gh release view "$ASSET_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          has_tarball=false
          has_checksum=false
          if printf '%s\n' "$attached" | grep -Fxq "$tarball"; then has_tarball=true; fi
          if printf '%s\n' "$attached" | grep -Fxq "$checksum"; then has_checksum=true; fi
          if [ "$has_tarball" = true ] && [ "$has_checksum" = true ]; then
            echo "$ASSET_TAG already carries $tarball and $checksum"
            exit 0
          fi
          if [ "$has_tarball" = true ]; then
            echo "::error::$ASSET_TAG carries $tarball but not $checksum; remove the tarball from the Release by hand, then re-run this job"
            exit 1
          fi
          if [ "$has_checksum" = true ]; then
            echo "::error::$ASSET_TAG carries $checksum but not $tarball; remove the checksum from the Release by hand, then re-run this job"
            exit 1
          fi
          gh release upload "$ASSET_TAG" "$tarball" --repo "$GITHUB_REPOSITORY"
          gh release upload "$ASSET_TAG" "$checksum" --repo "$GITHUB_REPOSITORY"
          echo "attached $tarball and $checksum to $ASSET_TAG"
