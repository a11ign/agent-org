name: release

# A RELEASE IS A GIT TAG AND A PUBLISH OF `@a11ign/agent-org` AT THAT TAG'S VERSION (ADR 0045 cut (a), a11ign/agent-org#1377; the `ceo` ruling on a11ign/a11ign#5248, 2026-10-13, under the
# chairman's 2026-10-09 rule for epic a11ign/a11ign#4425). This REPLACES "agent-org is published to NO registry" (chairman, a11ign/a11ign#928, 2026-10-03): the core obtains agent-org as a
# published package at a declared version. The tag is unchanged and still what the host runs (`update-tool` checks out the newest `vX.Y.Z`; `host.json`'s `toolVersion` pins one instead,
# which is the whole of a rollback), and a project that still takes `github:a11ign/agent-org#semver:^0.1.0` resolves it against the same tags. The registry copy is the SAME release: the
# shared workflow versions the commit, publishes it, and only then tags it, so the version npm prints is the version the tag names. So whoever lets a merge release is deciding what a
# project's CI installs, what the registry serves AND what the running org does; a publish cannot be unpublished, which is why `publish` sits in the `npm-publish` environment.
#
# THE STEPS ARE NOT HERE ANY MORE (a11ign/a11ign#3965, #3958; chairman, #928, 2026-10-07). This file is a CALLER of the one per-merge workflow every repository of the organisation
# shares, `release-per-merge.yml` in a11ign/toolchain, which does what this file used to do in its own steps: the gate waited for on the exact sha, the release commit on no branch
# (the last tag's version and changelog, the released changesets removed, then `changeset version`), the tag pushed atomically and never forced, and the Release carrying the
# CHANGELOG entry. Nothing is written to `main`, and `main`'s version and CHANGELOG.md lag the last tag, as before. Its behaviour is tested THERE (`release-parity.test.ts`,
# `release-per-merge.test.ts`); what only this call can get wrong is pinned HERE, by `release-triggers-itself.test.ts` (trigger, permissions, concurrency, what the call reaches)
# and `release-tag-on-merge.test.ts` (the pin and the inputs).
#
# THE PIN IS A FULL SHA, because a tag or a branch would let a push to toolchain change what this repository releases with no pull request here; Dependabot's `github-actions`
# entry moves it in a pull request that is reviewed. THE INPUTS: `kind: npm` (the publish job mints the OIDC token, in the `npm-publish` environment, from the release commit), `gate-check: gate` (ci.yml's required check),
# `node-version` as this file always ran, and, because agent-org has no `packageManager`, `pnpm-version` (the shared workflow refuses a repository with neither a `packageManager` nor a
# `pnpm-version`) and `changesets-version` (`pnpm dlx @changesets/cli@<changesets-version>` runs where there is no lockfile, and is the version package.json's `changeset` script names).
#
# `id-token: write` IS HELD BY THE CALL, AND UNDER `kind: npm` IT IS USED (ceo review of a11ign/agent-org#352 held it unused beside `kind: tag`). The called file's `publish` job asks for
# `id-token: write`, and GitHub checks a called workflow's job permissions against the caller's when the workflow is LOADED, not against a job's `if:`: a caller that withholds it fails
# the whole call before any job runs. The publish authenticates with that OIDC token alone, which is npm's trusted publishing: NO registry token and no secret is stored or passed, and
# the trusted-publisher entry on npmjs.com for `@a11ign/agent-org` names THIS file (repository `a11ign/agent-org`, workflow `release.yml`, environment `npm-publish`), because the token
# names the CALLING file: renaming it breaks the publish. The environment is restricted to `main`. The pair is pinned by `release-triggers-itself.test.ts`: the grant is on the call
# only, and only beside `kind: npm`. Not run before merge: the first run on `main` is its reading, and a refusal there is the entry or the environment missing, which is the owner's.
#
# THE CONSUMER IS CHECKED BEFORE THE TAG (a11ign/a11ign#4407 b, #4412). v0.88.0 renamed `src/*.mjs` to `.ts` and was tagged, and every a11ign pull request's `acceptance / run` then threw
# `ERR_MODULE_NOT_FOUND`: nothing between the merge and the tag asked whether the project that installs the tag still works against it. `consumer-check` is that question, and `release`
# `needs` it, so a red check leaves the tag uncut and the merge unreleased. It runs two steps in this order: `src/public-interface.test.ts` (the declared `exports` and `bin` still deliver every
# name a project is declared to use), then `src/release-consumer-check.test.ts` against a11ign/a11ign's CURRENT `main` (what the project imports through `agent-org/<subpath>` is a subset of
# that declaration). `main` and not a pin, because the point is how the project calls the tool NOW; the price is that a project change can hold this repository's release, which is the
# warning working. `src/release-consumer-check.test.ts` pins the job, its order, the `needs`, and that nothing (`if:`, `continue-on-error`) excuses it.
#
# A push that arrives while another run is waiting REPLACES the waiting run (GitHub keeps one). That is harmless: every run reads the unreleased changesets from its own tree.
# A tag pushed with GITHUB_TOKEN starts no workflow, and `on` here names branches only.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # `contents: read` alone: the check reads two public trees and writes nothing, and the tag is `release`'s to cut.
  consumer-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: The consumer -- a11ign/a11ign at main, read-only, into consumer/
        uses: actions/checkout@v7
        with:
          repository: a11ign/a11ign
          ref: main
          path: consumer
          persist-credentials: false
      # By name, as ci.yml's `suite` does (no lockfile here): Node 24 runs the `.ts` programs itself, `typescript` reads each declared module's exports, `yaml` parses the workflow the second test pins.
      - name: Install the dependencies the two tests import
        run: npm install --no-save --no-package-lock "typescript@^6.0.3" "yaml@^2.9.0"
      - name: The public-interface check -- every declared subpath and name is still delivered
        run: node --test src/public-interface.test.ts
      - name: The consumer check -- what a11ign imports is a subset of the declared interface
        env:
          A11IGN_CHECKOUT: ${{ github.workspace }}/consumer
        run: node --test src/release-consumer-check.test.ts

  release:
    needs: consumer-check
    permissions:
      # The tag and the Release are the only writes. No `pull-requests`, and no registry token anywhere: the publish is by OIDC.
      contents: write
      checks: read
      # Required to LOAD the call, and what the called `publish` job mints its npm trusted-publishing token with (see the header).
      id-token: write
    concurrency:
      group: release
      cancel-in-progress: false
    uses: a11ign/toolchain/.github/workflows/release-per-merge.yml@ab856fdd429c8989789dcc369c10b229b0833f2c
    with:
      kind: npm
      gate-check: gate
      node-version: 22.22.1
      pnpm-version: 10.34.5
      changesets-version: 3.0.1
