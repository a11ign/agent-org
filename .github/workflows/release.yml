name: release

# A RELEASE IS A GIT TAG, AND NOTHING ELSE (a11ign/a11ign#3069, #3134, #3187; chairman, a11ign/a11ign#928, 2026-10-03). agent-org is published to NO registry: a project takes
# `github:a11ign/agent-org#semver:^0.1.0`, which pnpm resolves against the tags of this repository (measured on pnpm 10.34.5 against a scratch repository: both
# `v0.1.0` and `0.1.0` resolve; the shared workflow cuts `v<version>`, the shape changesets gives a lone root package). So a release creates the tag `v<version>` and a GitHub
# Release carrying the CHANGELOG entry, and there is no npm, no OIDC and no registry token. If a registry is ever wanted that is a later decision under a name the chairman
# owns, and it is `kind: npm` in this call plus an `npm-publish` environment, not a different workflow.
#
# THIS FILE IS A CALLER (a11ign/a11ign#3958; ADR 0043, the one per-merge release workflow for every repository). The release itself -- the gate on the exact sha, the release
# commit on no branch, the tag, the Release -- is `release-per-merge.yml` in a11ign/toolchain, pinned below by FULL SHA and moved by a pull request here. What this file used
# to carry (its own `gate` and `release` jobs, ~180 lines of bash) is that workflow's `gate`, `version` and `tag` jobs, and its tests are `release-per-merge.test.ts` THERE.
# `main` takes no push that skips a review (#2022) and nothing here writes to it: its own `package.json` version and CHANGELOG.md LAG THE LAST TAG, and nothing reads them.
# A project reads the tag's tree, and the next release is computed from the tags, never from `main`'s version.
#
# THE TAG IS WHAT REACHES THE RUNNING ORG (a11ign/a11ign#3443, agent-org#151). The host that runs the org runs the newest `vX.Y.Z` tag: `update-tool` checks that tag out, and
# `host.json`'s `toolVersion` pins one tag instead, which is the whole of a rollback. A merge that carries a changeset is tagged and so is live about nine minutes after it lands
# (measured from the tag history on #3443); a merge with no changeset is never tagged and so is never live. A release here changes what a PROJECT's CI installs AND what the
# running org does, so whoever decides to cut one is deciding both. THE FILE NAME AND THE TAG SHAPE ARE `update-tool`'s: renaming this file or changing `v<version>` changes
# what the host follows.
#
# WHAT MUST HOLD BEFORE A TAG EXISTS is the called workflow's, and each is read there: `gate` -- ci.yml's required check, named below -- must have SUCCEEDED on the exact sha (read
# and waited for, not re-run); a tag is never moved, deleted or forced; the tag is `v` plus the version of the release commit, and its CHANGELOG.md holds an entry for it. This
# repository has no guard of its own to add in front, so the call `needs` nothing. A guard that is ever added is a job here and an entry in the call's `needs:`.
#
# THE CALLER'S NEEDS FROM THE REPOSITORY, which the called workflow's `version` job meets with `pnpm install --frozen-lockfile` and `pnpm exec changeset version`: a committed
# `pnpm-lock.yaml`, a `packageManager`, and `@changesets/cli` in `devDependencies`. The lockfile is for that job alone: ci.yml installs by name and does not read it.
#
# A push that arrives while another run is waiting REPLACES the waiting run (GitHub keeps one). That is harmless: every run reads the unreleased changesets from its own tree,
# which holds the replaced merge's, so the newer run releases both. A tag pushed with GITHUB_TOKEN starts no workflow, and `on` here names branches only.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      # `contents: write` is the tag and the Release, in the called workflow's `tag` job alone; `checks: read` is its `gate`. A called workflow can keep or reduce these and never
      # gain one. No `pull-requests`, and no `id-token`: `kind: tag` publishes nothing, so nothing here can mint an OIDC token.
      contents: write
      checks: read
    # No job-level `concurrency`: the workflow-level group above holds the whole run, and a job-level group of the same name would wait on its own run. The called workflow carries
    # its own, per repository.
    uses: a11ign/toolchain/.github/workflows/release-per-merge.yml@5ec501f5b8d05366deeb422493a0a1c54c7c37c8
    with:
      kind: tag
      gate-check: gate
