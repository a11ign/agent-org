<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pair this browser</title>
<style>
  :root { --bg: #f7f7f8; --panel: #fff; --text: #1d1d20; --muted: #6b6b76; --line: #e3e3e8; --accent: #3b5bdb; --bad: #c92a2a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141417; --panel: #1d1d22; --text: #ececf1; --muted: #9a9aa6; --line: #2e2e36; --accent: #748ffc; --bad: #ff6b6b; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 440px; margin: 12vh auto 0; padding: 0 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { margin: 0 0 16px; color: var(--muted); }
  code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text); }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text);
    font: 16px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; }
  button { padding: 8px 16px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #status { color: var(--bad); margin: 12px 0 0; min-height: 1.45em; }
</style>
</head>
<body>
<main>
  <div class="panel">
    <h1>Pair this browser with the ticket board</h1>
    <p>Run <code>agent-org ticket:pair</code> on this machine, then type the code it prints before it expires. Each code works once. This browser then stays paired.</p>
    <form id="pair">
      <input id="code" aria-label="Pairing code" placeholder="ABCD-EFGH" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" required autofocus>
      <button id="submit" type="submit">Pair</button>
    </form>
    <p id="status" role="status"></p>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  $("pair").addEventListener("submit", async (event) => {
    event.preventDefault();
    $("submit").disabled = true;
    $("status").textContent = "";
    try {
      const response = await fetch("/pair", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: $("code").value }) });
      if (response.ok) return location.replace("/");
      const { error } = await response.json().catch(() => ({ error: response.statusText }));
      $("status").textContent = error;
    } catch (err) {
      $("status").textContent = String(err.message || err);
    }
    $("submit").disabled = false;
  });
</script>
</body>
</html>
